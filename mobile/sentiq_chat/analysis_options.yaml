include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    - build/**
  errors:
    invalid_use_of_visible_for_testing_member: error
    invalid_use_of_protected_member: error

linter:
  rules:
    always_declare_return_types: true
    avoid_dynamic_calls: true
    avoid_print: true
    # Named dependency-injection constructors deliberately keep dependencies
    # private; converting them to initializing formals would expose private
    # parameter names across feature boundaries.
    prefer_initializing_formals: false
    prefer_final_locals: true
    prefer_single_quotes: true
    sort_constructors_first: true
    sort_unnamed_constructors_first: true
    unawaited_futures: true
