name: sentiq_chat
description: Native Android client for SentIQ Chat.
publish_to: none
version: 1.0.0+6

environment:
  sdk: '>=3.12.0 <4.0.0'
  flutter: 3.44.8

dependencies:
  flutter:
    sdk: flutter
  connectivity_plus: 7.3.1
  file_picker: 10.3.10
  flutter_markdown_plus: 1.0.12
  flutter_math_fork: 0.7.4
  flutter_riverpod: 2.6.1
  flutter_secure_storage: 10.3.1
  http: 1.5.0
  http_parser: 4.1.2
  image_picker: 1.2.0
  markdown: 7.3.1
  razorpay_flutter: 1.4.5
  path: 1.9.1
  shared_preferences: 2.5.5
  sqflite: 2.4.3
  supabase_flutter: 2.16.0
  url_launcher: 6.3.2
  uuid: 4.5.1
  web_socket_channel: 3.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: 6.0.0
  sqflite_common_ffi: 2.4.2

flutter:
  uses-material-design: true
  assets:
    - test/fixtures/
