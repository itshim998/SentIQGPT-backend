name: sentiq_chat
description: Native Android client for SentIQ Chat.
publish_to: none
version: 0.2.0+2

environment:
  sdk: '>=3.12.0 <4.0.0'
  flutter: 3.44.8

dependencies:
  flutter:
    sdk: flutter
  connectivity_plus: 7.3.1
  flutter_riverpod: 2.6.1
  http: 1.5.0
  path: 1.9.1
  shared_preferences: 2.5.5
  sqflite: 2.4.3
  supabase_flutter: 2.16.0
  uuid: 4.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: 6.0.0
  sqflite_common_ffi: 2.4.2

flutter:
  uses-material-design: true
  assets:
    - test/fixtures/
