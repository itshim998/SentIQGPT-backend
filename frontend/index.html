  function highlightCode(code, lang) {
    const escaped = escapeHtml(code);
    const def = SH_LANGS[lang?.toLowerCase()];
    if (!def) return escaped;

    // Special handlers
    if (def.special === 'html' || def.special === 'xml') return highlightHTML(escaped);
    if (def.special === 'css') return highlightCSS(escaped);
    if (def.special === 'json') return highlightJSON(escaped);
    if (def.special === 'md') return escaped;

    let result = escaped;
    // Comments: // and # (for python/bash/etc)
    const lineComment = (lang === 'python' || lang === 'py' || lang === 'bash' || lang === 'sh' || lang === 'shell' || lang === 'zsh' || lang === 'yml' || lang === 'yaml' || lang === 'toml') ? '#' : '//';
    const hasBlockComment = !['python','py','bash','sh','shell','zsh','go','rust','rs','yml','yaml','toml'].includes(lang?.toLowerCase() || '');

    // Tokenize by lines to handle comment detection properly
    const tokens = [];
    let i = 0;
    while (i < result.length) {
      // Block comments /* */
      if (hasBlockComment && result.slice(i, i+4) === '/*') {
        const end = result.indexOf('*/', i + 2);
        const closeIdx = end === -1 ? result.length : end + 2;
        tokens.push('<span class="sh-cm">' + result.slice(i, closeIdx) + '</span>');
        i = closeIdx;
        continue;
      }
      // Line comments
      const lcEsc = escapeHtml(lineComment);
      if (result.slice(i, i + lcEsc.length) === lcEsc) {
        const nlIdx = result.indexOf('\n', i);
        const eol = nlIdx === -1 ? result.length : nlIdx;
        tokens.push('<span class="sh-cm">' + result.slice(i, eol) + '</span>');
        i = eol;
        continue;
      }
      // Strings (double and single quotes, backticks)
      if (result[i] === '&' && (result.slice(i, i+6) === '&quot;' || result.slice(i, i+5) === '&#39;')) {
        const isDouble = result.slice(i, i+6) === '&quot;';
        const delim = isDouble ? '&quot;' : '&#39;';
        const dLen = delim.length;
        let j = i + dLen;
        while (j < result.length) {
          if (result.slice(j, j + dLen) === delim) { j += dLen; break; }
          if (result[j] === '\\') { j += 2; continue; }
          j++;
        }
        tokens.push('<span class="sh-str">' + result.slice(i, j) + '</span>');
        i = j;
        continue;
      }
      if (result[i] === '`') {
        let j = i + 1;
        while (j < result.length && result[j] !== '`') { if (result[j] === '\\') j++; j++; }
        tokens.push('<span class="sh-str">' + result.slice(i, j + 1) + '</span>');
        i = j + 1;
        continue;
      }
      // Numbers
      if (/[0-9]/.test(result[i]) && (i === 0 || /[\s(,=+\-*\/:;&lt;&gt;\[\{!|]/.test(result[i-1]))) {
        let j = i;
        while (j < result.length && /[0-9a-fA-Fx._]/.test(result[j])) j++;
        tokens.push('<span class="sh-num">' + result.slice(i, j) + '</span>');
        i = j;
        continue;
      }
      // Words (identifiers / keywords)
      if (/[a-zA-Z_$@]/.test(result[i])) {
        let j = i;
        while (j < result.length && /[a-zA-Z0-9_$!]/.test(result[j])) j++;
        const word = result.slice(i, j);
        const kwRe = def.kw ? new RegExp('^(' + def.kw + ')$') : null;
        const biRe = def.bi ? new RegExp('^(' + def.bi + ')$') : null;
        // Check if followed by ( → function call
        const nextNonSpace = result.slice(j).match(/^\s*\(/);
        if (kwRe && kwRe.test(word)) {
          tokens.push('<span class="sh-kw">' + word + '</span>');
        } else if (biRe && biRe.test(word)) {
          tokens.push('<span class="sh-bi">' + word + '</span>');
        } else if (nextNonSpace && !kwRe?.test(word)) {
          tokens.push('<span class="sh-fn">' + word + '</span>');
        } else if (word[0] === '@') {
          tokens.push('<span class="sh-at">' + word + '</span>');
        } else {
          tokens.push(word);
        }
        i = j;
        continue;
      }
      // Operators
      if ('=+-*/<>&|!%^~?:'.includes(result[i]) || (result[i] === '&' && (result.slice(i,i+4)==='&lt;' || result.slice(i,i+4)==='&gt;' || result.slice(i,i+5)==='&amp;'))) {
        if (result.slice(i,i+4)==='&lt;') { tokens.push('<span class="sh-op">&lt;</span>'); i+=4; continue; }
        if (result.slice(i,i+4)==='&gt;') { tokens.push('<span class="sh-op">&gt;</span>'); i+=4; continue; }
        if (result.slice(i,i+5)==='&amp;') { tokens.push('<span class="sh-op">&amp;</span>'); i+=5; continue; }
        tokens.push('<span class="sh-op">' + result[i] + '</span>');
        i++;
        continue;
      }
      // Punctuation
      if ('(){}[];,.'.includes(result[i])) {
        tokens.push('<span class="sh-pn">' + result[i] + '</span>');
        i++;
        continue;
      }
      tokens.push(result[i]);
      i++;
    }
    return tokens.join('');
  }

  function highlightHTML(escaped) {
    // Tags
    let result = escaped.replace(/&lt;(\/?)(\w+)(.*?)(&gt;)/g, (m, slash, tag, attrs, close) => {
      const hAttrs = attrs.replace(/(\w[\w-]*)\s*=\s*(&quot;[^&]*&quot;|&#39;[^&]*&#39;)/g,
        (am, name, val) => '<span class="sh-at">' + name + '</span>=<span class="sh-str">' + val + '</span>');
      return '<span class="sh-pn">&lt;' + slash + '</span><span class="sh-tg">' + tag + '</span>' + hAttrs + '<span class="sh-pn">&gt;</span>';
    });
    // Comments
    result = result.replace(/&lt;!--(.*?)--&gt;/gs, '<span class="sh-cm">&lt;!--$1--&gt;</span>');
    return result;
  }

  function highlightCSS(escaped) {
    let result = escaped;
    // Comments
    result = result.replace(/\/\*[\s\S]*?\*\//g, m => '<span class="sh-cm">' + m + '</span>');
    // Selectors (lines ending with {)
    result = result.replace(/^([^{}\/\n]+)(\{)/gm, (m, sel, brace) => '<span class="sh-tg">' + sel + '</span><span class="sh-pn">' + brace + '</span>');
    // Properties
    result = result.replace(/(\s+)([\w-]+)(\s*:\s*)/g, (m, ws, prop, colon) => ws + '<span class="sh-at">' + prop + '</span>' + colon);
    // Strings
    result = result.replace(/(&quot;[^&]*&quot;|&#39;[^&]*&#39;)/g, '<span class="sh-str">$1</span>');
    // Numbers with units
    result = result.replace(/(\b\d+\.?\d*)(px|rem|em|%|vh|vw|s|ms|deg|fr)?\b/g, '<span class="sh-num">$1$2</span>');
    return result;
  }

  function highlightJSON(escaped) {
    let result = escaped;
    // Keys
    result = result.replace(/(&quot;)((?:(?!&quot;).)*)(&quot;)(\s*:)/g,
      '<span class="sh-key">$1$2$3</span>$4');
    // String values
    result = result.replace(/(:\s*)(&quot;)((?:(?!&quot;).)*)(&quot;)/g,
      '$1<span class="sh-str">$2$3$4</span>');
    // Numbers
    result = result.replace(/(:\s*)(\d+\.?\d*)/g, '$1<span class="sh-num">$2</span>');
    // Booleans & null
    result = result.replace(/\b(true|false|null)\b/g, '<span class="sh-kw">$1</span>');
    return result;
  }

  // ================================================================
  // Markdown Rendering
  // ================================================================
  function renderRichText(text) {
    if (!text) return "";
    // Extract code blocks first, replace with placeholders
    const codeBlocks = [];
    const withPlaceholders = text.replace(/```(\w*)\n([\s\S]*?)```/g, (match, lang, code) => {
      codeBlocks.push({ lang: lang || 'code', code });
      return `\x00CB${codeBlocks.length - 1}\x00`;
    });

    // Escape and process markdown on the non-code parts
    let html = escapeHtml(withPlaceholders);
    html = html.replace(/`([^`]+)`/g, "<code>$1</code>");
    html = html.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
    html = html.replace(/(?<!\*)\*([^*]+)\*(?!\*)/g, "<em>$1</em>");
    html = html.split("\n\n").map((p) => `<p>${p.trim()}</p>`).join("");
    html = html.replace(/(?<!\n)\n(?!\n)/g, "<br>");

    // Restore code blocks with syntax highlighting
    html = html.replace(/\x00CB(\d+)\x00/g, (m, idx) => {
      const block = codeBlocks[parseInt(idx)];
      const langLabel = escapeHtml(block.lang);
      const highlighted = highlightCode(block.code, block.lang);
      return `<div class="code-block-wrap"><div class="code-block-header"><span class="code-block-lang">${langLabel}</span><button class="code-copy-btn" onclick="window.SentIQChat.copyCode(this)"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg> Copy</button></div><pre><code>${highlighted}</code></pre></div>`;
    });

    return html;
  }

  function escapeHtml(str) {
    const div = document.createElement("div");
    div.textContent = str;
    return div.innerHTML;
  }

  function copyCode(btn) {
    const wrap = btn.closest(".code-block-wrap");
    const pre = wrap?.querySelector("pre");
    if (pre) {
      const code = pre.textContent;
      navigator.clipboard.writeText(code).then(() => {
        btn.classList.add("copied");
        btn.innerHTML = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="20 6 9 17 4 12"/></svg> Copied!';
        setTimeout(() => {
          btn.classList.remove("copied");
          btn.innerHTML = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg> Copy';
        }, 2000);
      });
    }
  }

  function createStreamingBubble() {
    console.log("[UI] createStreamingBubble");
    if (!chatMessages) return null;
    const bubble = document.createElement("div");
    bubble.className = "message assistant";
    const header = document.createElement("div");
    header.className = "message-header";
    const avatar = document.createElement("div");
    avatar.className = "message-avatar";
    avatar.textContent = "S";
    const sender = document.createElement("div");
    sender.className = "message-sender";
    sender.textContent = "SentIQGPT";
    header.appendChild(avatar);
    header.appendChild(sender);
    bubble.appendChild(header);
    const contentDiv = document.createElement("div");
    contentDiv.className = "message-content typing-active";
    bubble.appendChild(contentDiv);
    chatMessages.appendChild(bubble);
    scrollToBottom();

    // Buffered rAF typing — tokens accumulate, chars reveal smoothly
    let fullText = "";
    let displayedChars = 0;
    let streamDone = false;
    let rafId = 0;
    let frameCount = 0;
    let finalizeResolve = null;
    const textNode = document.createTextNode('');
    contentDiv.appendChild(textNode);

    function finalize() {
      contentDiv.classList.remove('typing-active');
      contentDiv.innerHTML = renderRichText(fullText);
      scrollToBottom();
      rafId = 0;
      if (finalizeResolve) { finalizeResolve(); finalizeResolve = null; }
    }

    function tick() {
      if (displayedChars >= fullText.length) {
        if (streamDone) { finalize(); return; }
        // Caught up to buffer — pause until more tokens arrive
        rafId = 0;
        return;
      }
      const remaining = fullText.length - displayedChars;
      const charsPerFrame = remaining > 1000 ? 6 : remaining > 300 ? 4 : remaining > 100 ? 3 : remaining > 30 ? 2 : 1;
      displayedChars = Math.min(displayedChars + charsPerFrame, fullText.length);
      textNode.nodeValue = fullText.substring(0, displayedChars);
      frameCount++;
      if (frameCount % 8 === 0) scrollToBottom(true);
      rafId = requestAnimationFrame(tick);
    }

    return {
      appendToken(token) {
        fullText += token;
        if (!rafId) rafId = requestAnimationFrame(tick);
      },
      finish() {
        streamDone = true;
        return new Promise((resolve) => {
          finalizeResolve = resolve;
          if (!rafId) {
            if (displayedChars >= fullText.length) finalize();
            else rafId = requestAnimationFrame(tick);
          }
        });
      },
      getFullText() { return fullText; },
    };
  }

  async function handleSend(retryMessage) {
    if (!chatInput && !retryMessage) return;
    const message = retryMessage || chatInput.value.trim();
    if (!message && pendingFiles.length === 0) return;
    if (!currentChatId) await startNewChat();
    hideWelcome();
    if (!retryMessage) { chatInput.value = ""; chatInput.style.height = "auto"; }
    console.log("[UI] handleSend:", message.slice(0, 60));

    if (pendingFiles.length > 0) { await processPendingFiles(message); return; }
    if (imageMode && message) { setImageMode(false); await handleImageGeneration(message); return; }

    // Auto-detect image generation requests from normal chat
    if (message && isImageRequest(message)) {
      await handleImageGeneration(message);
      return;
    }

    // Capture chat context for this request
    const targetChatId = currentChatId;
    const requestId = newRequestId(targetChatId);
    const state = getChatState(targetChatId);
    state.isThinking = true;
    const ac = new AbortController();
    state.abortController = ac;
    setStopMode();

    if (!retryMessage) {
      appendMessageBubble("user", message);
      await Storage.addMessageToChat(targetChatId, "user", message);
    }
    if (targetChatId === currentChatId && typingIndicator) {
      typingIndicator.style.display = "flex";
      startThinkingTimer();
    }
    // Reset scroll state so new messages auto-scroll
    _userScrolledUp = false;
    if (scrollAnchorPill) scrollAnchorPill.classList.remove("visible");
    scrollToBottom();

    try {
      const chat = await Storage.getChat(targetChatId);
      const memories = await Storage.getTopMemories(10);
      const files = await Storage.getAllFiles();
      const recentMessages = (chat?.messages || []).slice(-20).map((m) => ({ role: m.role, content: m.content }));
      const fileReferences = files.map((f) => {
        const text = f.extracted_text || "";
        console.log(`[Frontend] attaching extractedText (length=${text.length}) for ${f.filename}`);
        return { filename: f.filename, extractedText: text };
      });
      console.log(`[API Request] file_references count=${fileReferences.length}`);
      const contextPayload = {
        recentMessages,
        memories: memories.map((m) => ({ type: m.type, summary: m.summary })),
        fileReferences,
      };

      let fullReply = "";
      let memoryResult = null;
      let usedStreaming = false;

      // Abort early if user switched away and a new request was issued
      if (isRequestStale(targetChatId, requestId)) return;

      try {
        console.log("[UI] Attempting streaming...");
        const streamBubble = (targetChatId === currentChatId) ? createStreamingBubble() : null;
        if (streamBubble && typeof API.sendMessageStream === "function") {
          usedStreaming = true;
          if (targetChatId === currentChatId && typingIndicator) typingIndicator.style.display = "none";
          stopThinkingTimer();
          await API.sendMessageStream(message, contextPayload, {
            onToken(token) {
              if (!isRequestStale(targetChatId, requestId)) streamBubble.appendToken(token);
            },
            onMemory(memory) { memoryResult = memory; },
            onError(err) { console.error("[UI] Stream error:", err); },
          }, ac.signal);
          await streamBubble.finish();
          fullReply = streamBubble.getFullText();
          console.log("[UI] Streaming complete, length:", fullReply.length);
        }
      } catch (streamErr) {
        if (streamErr.name === "AbortError") {
          console.log("[UI] Stream aborted by user");
          // User interrupted — finalize partial response
          const orphanContent = chatMessages?.querySelector(".message.assistant:last-child .typing-active");
          if (orphanContent) {
            orphanContent.classList.remove("typing-active");
            const partial = orphanContent.textContent || "";
            if (partial) {
              orphanContent.innerHTML = renderRichText(partial);
              fullReply = partial;
            } else {
              orphanContent.closest(".message")?.remove();
            }
          }
          usedStreaming = true; // skip non-streaming fallback
        } else {
          console.warn("[UI] Streaming failed, falling back to non-streaming:", streamErr.message);
          usedStreaming = false;
          // Remove orphaned streaming bubble on failure
          const orphan = chatMessages?.querySelector(".message.assistant:last-child .typing-active");
          if (orphan) orphan.closest(".message")?.remove();
        }
      }

      if (isRequestStale(targetChatId, requestId) && !ac.signal.aborted) {
        // Still persist the reply even if view moved on
        if (fullReply) await Storage.addMessageToChat(targetChatId, "assistant", fullReply);
        return;
      }

      if (!usedStreaming) {
        console.log("[UI] Using non-streaming fallback");
        const response = await API.sendMessage(message, contextPayload);
        if (isRequestStale(targetChatId, requestId)) {
          if (response.reply) await Storage.addMessageToChat(targetChatId, "assistant", response.reply);
          return;
        }
        if (response.route === "image_generation" && response.image) {
          if (response.image.success) {
            let imageUrl = "";
            if (response.image.image_url) imageUrl = response.image.image_url;
            else if (response.image.image_base64) imageUrl = `data:image/png;base64,${response.image.image_base64}`;
            const meta = { type: "image", imageUrl, prompt: response.image.prompt };
            appendMessageBubble("assistant", "", meta);
            await Storage.addMessageToChat(targetChatId, "assistant", "", meta);
          } else {
            const { contentDiv: errDiv } = appendMessageBubble("assistant", "");
            typeMessage("Sorry, I couldn\u2019t generate that image. Please try again.", errDiv);
            await Storage.addMessageToChat(targetChatId, "assistant", "Sorry, I couldn\u2019t generate that image. Please try again.");
          }
        } else {
          fullReply = response.reply;
          if (targetChatId === currentChatId) {
            const { contentDiv } = appendMessageBubble("assistant", "");
            if (typingIndicator) typingIndicator.style.display = "none";
            stopThinkingTimer();
            await typeMessage(fullReply, contentDiv);
          } else {
            appendMessageBubble("assistant", fullReply);
          }
        }
        memoryResult = response.memory;
      }

      if (fullReply) await Storage.addMessageToChat(targetChatId, "assistant", fullReply);
      if (memoryResult?.stored && memoryResult.summary) {
        await Storage.storeMemory({ type: memoryResult.type, summary: memoryResult.summary, importance: memoryResult.importance });
      }
      await maybeGenerateTitle(message, fullReply || "");
    } catch (err) {
      if (err.name === "AbortError") { /* user-initiated stop — already handled */ }
      else if (!isRequestStale(targetChatId, requestId)) {
        console.error("[UI] Chat error:", err);
        // Styled error bubble with retry
        const { contentDiv: errDiv } = appendMessageBubble("assistant", "");
        errDiv.innerHTML = "";
        const wrap = document.createElement("div");
        wrap.className = "message-error-wrap";
        const errText = document.createElement("p");
        errText.className = "message-error-text";
        errText.textContent = "Sorry, something went wrong. Please try again.";
        wrap.appendChild(errText);
        const retryBtn = document.createElement("button");
        retryBtn.className = "error-retry-btn";
        retryBtn.textContent = "Retry";
        const capturedMsg = message;
        retryBtn.addEventListener("click", () => {
          // Remove this error bubble and retry
          errDiv.closest(".message")?.remove();
          handleSend(capturedMsg);
        });
        wrap.appendChild(retryBtn);
        errDiv.appendChild(wrap);
        showToast("Failed to get response. You can retry.", "error");
      }
    } finally {
      state.isThinking = false;
      state.abortController = null;
      stopThinkingTimer();
      if (targetChatId === currentChatId && typingIndicator) typingIndicator.style.display = "none";
      setSendMode();
      await loadChatList();
    }
  }

  function toggleImageMode() {
    if (!imageMode) {
      const quota = checkImageQuota();
      if (quota.exhausted) {
        showQuotaWarning("Image generation quota reached. Please try again after 24 hours.");
        return;
      }
    }
    setImageMode(!imageMode);
  }

  function setImageMode(active) {
    imageMode = active;
    if (imageModeBar) imageModeBar.style.display = active ? "flex" : "none";
    imageGenBtn?.classList.toggle("active", active);
    if (chatInput) {
      chatInput.placeholder = active ? "Describe the image you want to generate..." : "Message SentIQGPT...";
      chatInput.focus();
    }
  }

  async function handleImageGeneration(prompt) {
    // Enforce client-side quota
    const quota = checkImageQuota();
    if (quota.exhausted) {
      showQuotaWarning("Image generation quota reached. Please try again after 24 hours.");
      hideImageButton();
      return;
    }

    // Enforce client-side cooldown
    const cooldown = checkImageCooldown();
    if (cooldown.active) {
      const waitSec = Math.ceil(cooldown.waitMs / 1000);
      showQuotaWarning(`Please wait ${waitSec} second${waitSec !== 1 ? "s" : ""} before generating another image.`);
      return;
    }

    if (!currentChatId) await startNewChat();
    const targetChatId = currentChatId;
    const requestId = newRequestId(targetChatId);
    const state = getChatState(targetChatId);
    state.isThinking = true;

    appendMessageBubble("user", `🎨 Generate image: ${prompt}`);
    await Storage.addMessageToChat(targetChatId, "user", `🎨 Generate image: ${prompt}`);
    if (targetChatId === currentChatId && typingIndicator) typingIndicator.style.display = "flex";
    scrollToBottom();

    // Slow-inference hint: if generation takes over 8s, update typing indicator text
    let slowHintTimer = null;
    if (typingIndicator) {
      slowHintTimer = setTimeout(() => {
        if (state.isThinking && targetChatId === currentChatId) {
          const dots = typingIndicator.querySelector(".typing-dots");
          if (dots) dots.insertAdjacentHTML("beforebegin", '<span class="slow-hint">Your image is being generated... </span>');
        }
      }, 8000);
    }

    const ac = new AbortController();
    state.abortController = ac;
    setStopMode();

    try {
      updateImageCooldown();
      incrementImageQuota();
      const result = await API.generateImage(prompt);
      if (isRequestStale(targetChatId, requestId)) {
        if (result.success) {
          const meta = { type: "image", imageUrl: result.image_url || "", prompt };
          await Storage.addMessageToChat(targetChatId, "assistant", "", meta);
        }
        return;
      }
      if (result.success) {
        let imageUrl = "";
        if (result.image_url) imageUrl = result.image_url;
        else if (result.image_base64) imageUrl = `data:image/png;base64,${result.image_base64}`;
        const meta = { type: "image", imageUrl, prompt };
        appendMessageBubble("assistant", "", meta);
        await Storage.addMessageToChat(targetChatId, "assistant", "", meta);
      } else {
        const friendlyErr = "Sorry, I couldn\u2019t generate that image. Please try again.";
        const { contentDiv: imgErrDiv } = appendMessageBubble("assistant", "");
        typeMessage(friendlyErr, imgErrDiv);
        await Storage.addMessageToChat(targetChatId, "assistant", friendlyErr);
      }
    } catch (err) {
      if (isRequestStale(targetChatId, requestId)) return;
      if (err.name === "AbortError") { /* user-initiated stop */ }
      else if (err.message && (err.message.includes("Daily image limit") || err.message.includes("Please wait"))) {
        showQuotaWarning(err.message);
      } else if (err.message && err.message.includes("queue is full")) {
        showQuotaWarning("The image generation server is busy. Please try again in a moment.");
      } else {
        const { contentDiv: genErrDiv } = appendMessageBubble("assistant", "");
        typeMessage("Sorry, something went wrong generating that image. Please try again.", genErrDiv);
        console.error("[UI] Image generation error:", err);
      }
    } finally {
      if (slowHintTimer) clearTimeout(slowHintTimer);
      // Clean up slow-hint text if it was added
      if (typingIndicator) {
        const hint = typingIndicator.querySelector(".slow-hint");
        if (hint) hint.remove();
      }
      state.isThinking = false;
      state.abortController = null;
      if (targetChatId === currentChatId && typingIndicator) typingIndicator.style.display = "none";
      setSendMode();
      updateImageButtonState();
      await loadChatList();
    }
  }

  function handleFileSelect(e) {
    const files = e.target.files;
    if (!files || files.length === 0) return;
    for (const file of files) pendingFiles.push(file);
    renderFilePreview();
    if (fileInput) fileInput.value = "";
    chatInput?.focus();
  }

  function renderFilePreview() {
    if (!filePreviewArea) return;
    if (pendingFiles.length === 0) { filePreviewArea.style.display = "none"; return; }
    filePreviewArea.style.display = "flex";
    filePreviewArea.innerHTML = "";
    pendingFiles.forEach((file, index) => {
      const chip = document.createElement("div");
      chip.className = "file-chip";
      const icon = document.createElement("span");
      icon.textContent = "📄";
      const name = document.createElement("span");
      name.textContent = file.name.length > 25 ? file.name.slice(0, 22) + "..." : file.name;
      const removeBtn = document.createElement("button");
      removeBtn.className = "file-chip-remove";
      removeBtn.textContent = "✕";
      removeBtn.addEventListener("click", () => { pendingFiles.splice(index, 1); renderFilePreview(); });
      chip.appendChild(icon);
      chip.appendChild(name);
      chip.appendChild(removeBtn);
      filePreviewArea.appendChild(chip);
    });
  }

  async function processPendingFiles(message) {
    const filesToProcess = [...pendingFiles];
    pendingFiles = [];
    renderFilePreview();
    for (const file of filesToProcess) {
      const uploadMeta = { type: "file-upload", filename: file.name };
      appendMessageBubble("user", `Uploaded file: ${file.name}`, uploadMeta);
      await Storage.addMessageToChat(currentChatId, "user", `Uploaded file: ${file.name}`);
      if (typingIndicator) typingIndicator.style.display = "flex";
      scrollToBottom();
      try {
        const result = await API.uploadFile(file);
        await Storage.storeFile({
          filename: result.filename, type: result.type,
          extracted_text: result.extracted_text, size_bytes: result.size_bytes, blob: file,
        });
        const confirmMsg = `I've processed **${result.filename}** (${result.type.toUpperCase()}, ${Math.round(result.size_bytes / 1024)} KB). The content has been extracted and is now available in our conversation context.`;
        const { contentDiv: fileDiv } = appendMessageBubble("assistant", "");
        typeMessage(confirmMsg, fileDiv);
        await Storage.addMessageToChat(currentChatId, "assistant", confirmMsg);
      } catch (err) {
        const { contentDiv: upErrDiv } = appendMessageBubble("assistant", "");
        typeMessage(`Sorry, I couldn\u2019t process that file. Please try again.`, upErrDiv);
        console.error("[UI] Upload error:", err);
      } finally {
        if (typingIndicator) typingIndicator.style.display = "none";
      }
    }
    if (message) { chatInput.value = message; await handleSend(); }
    await loadChatList();
  }

  function handleVoiceInput() {
    if (!("webkitSpeechRecognition" in window) && !("SpeechRecognition" in window)) {
      alert("Voice input is not supported in this browser.");
      return;
    }
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    const recognition = new SpeechRecognition();
    recognition.lang = "en-US";
    recognition.interimResults = false;
    voiceBtn?.classList.add("active");
    recognition.onresult = (event) => {
      const transcript = event.results[0][0].transcript;
      if (chatInput) { chatInput.value += transcript; autoResizeInput(); }
      voiceBtn?.classList.remove("active");
    };
    recognition.onerror = () => { voiceBtn?.classList.remove("active"); };
    recognition.onend = () => { voiceBtn?.classList.remove("active"); };
    recognition.start();
  }

  function openSettings() {
    if (settingsModal) settingsModal.style.display = "flex";
    sidebar?.classList.remove("open");
    window.SentIQMemoryPanel?.renderMemories();
  }
  function closeSettings() {
    if (settingsModal) settingsModal.style.display = "none";
  }

  async function startNewChat() {
    console.log("[UI] startNewChat");
    const chat = await Storage.createChat("New Chat");
    currentChatId = chat.id;
    if (chatMessages) chatMessages.innerHTML = "";
    showWelcome();
    updateHtmlTitle("");
    await loadChatList();
    if (chatInput) chatInput.focus();
    sidebar?.classList.remove("open");
  }

  function updateHtmlTitle(chatTitle) {
    document.title = chatTitle ? `${chatTitle} — SentIQGPT` : "SentIQGPT";
  }

  function typeChatTitle(chatId, title) {
    const titleEl = chatList?.querySelector(`[data-id="${chatId}"] .chat-list-item-title`);
    if (!titleEl) return Promise.resolve();
    return new Promise((resolve) => {
      titleEl.textContent = "";
      titleEl.classList.add("typing");
      let i = 0;
      const interval = setInterval(() => {
        titleEl.textContent = title.slice(0, ++i);
        if (i >= title.length) {
          clearInterval(interval);
          titleEl.classList.remove("typing");
          resolve();
        }
      }, 30);
    });
  }

  async function maybeGenerateTitle(userMessage, assistantReply) {
    if (!currentChatId) return;
    const chat = await Storage.getChat(currentChatId);
    if (!chat) return;
    const msgCount = chat.messages.filter((m) => m.role === "user").length;
    if (msgCount > 1) return;
    try {
      const result = await API.generateTitle(userMessage, assistantReply);
      if (result.title) {
        await Storage.updateChatTitle(currentChatId, result.title);
        await loadChatList();
        await typeChatTitle(currentChatId, result.title);
        updateHtmlTitle(result.title);
      }
    } catch { /* non-critical */ }
  }

  function scrollToBottom(instant) {
    if (!chatMessages) return;
    if (_userScrolledUp) {
      // Show "new messages" pill instead of forcing scroll
      if (scrollAnchorPill) scrollAnchorPill.classList.add("visible");
      return;
    }
    chatMessages.scrollTo({ top: chatMessages.scrollHeight, behavior: instant ? 'auto' : 'smooth' });
  }

  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", init);
  else init();

  window.SentIQChat = { copyCode, appendMessageBubble, loadChatList, openSettings, closeSettings };
})();
  </script>

  <script>
// ================================================================
// 4. Memory Panel
// ================================================================
(function () {
  const Storage = window.SentIQStorage;
  const API = window.SentIQAPI;
  const memoryList = document.getElementById("memory-list");
  const memoryCount = document.getElementById("memory-count");
  const compressBtn = document.getElementById("compress-memories-btn");

  async function renderMemories() {
    if (!memoryList) return;
    const memories = await Storage.getAllMemories();
    memoryList.innerHTML = "";
    if (memoryCount) memoryCount.textContent = `${memories.length} memories`;

    if (memories.length === 0) {
      memoryList.innerHTML = '<p style="color: var(--text-muted); font-size: 0.85rem; padding: 12px 0;">No memories stored yet. Memories are automatically created during conversations.</p>';
      return;
    }
    const groups = {};
    for (const mem of memories) { if (!groups[mem.type]) groups[mem.type] = []; groups[mem.type].push(mem); }

    for (const [type, items] of Object.entries(groups)) {
      const section = document.createElement("div");
      section.className = "memory-group";
      const header = document.createElement("h4");
      header.className = "memory-group-header";
      header.textContent = type.charAt(0).toUpperCase() + type.slice(1);
      section.appendChild(header);

      for (const mem of items.sort((a, b) => b.importance - a.importance)) {
        const item = document.createElement("div");
        item.className = "memory-item";
        item.innerHTML = `
          <div class="memory-summary">${escapeHtmlMem(mem.summary)}</div>
          <div class="memory-meta">${mem.importance}/10 · ${new Date(mem.timestamp).toLocaleDateString()}</div>
        `;
        const deleteBtn = document.createElement("button");
        deleteBtn.className = "memory-delete-btn";
        deleteBtn.textContent = "Delete";
        deleteBtn.addEventListener("click", async () => { await Storage.deleteMemory(mem.id); await renderMemories(); });
        item.appendChild(deleteBtn);
        section.appendChild(item);
      }
      memoryList.appendChild(section);
    }
  }

  compressBtn?.addEventListener("click", async () => {
    const memories = await Storage.getAllMemories();
    if (memories.length < 5) { alert("Not enough memories to compress (need at least 5)."); return; }
    compressBtn.disabled = true;
    compressBtn.textContent = "Compressing...";
    const sorted = memories.sort((a, b) => new Date(a.timestamp) - new Date(b.timestamp));
    const toCompress = sorted.slice(0, Math.floor(sorted.length / 2));
    const groups = {};
    for (const mem of toCompress) { if (!groups[mem.type]) groups[mem.type] = []; groups[mem.type].push(mem); }
    for (const [type, items] of Object.entries(groups)) {
      if (items.length < 2) continue;
      try {
        const result = await API.compressMemories(items);
        if (result.compressed_summary) {
          for (const item of items) await Storage.deleteMemory(item.id);
          await Storage.storeMemory({ type, summary: result.compressed_summary, importance: result.importance || 5 });
        }
      } catch (err) { console.error(`[UI] Compression failed for type ${type}:`, err); }
    }
    compressBtn.disabled = false;
    compressBtn.textContent = "Compress Memories";
    await renderMemories();
  });

  function escapeHtmlMem(str) { const div = document.createElement("div"); div.textContent = str; return div.innerHTML; }

  window.SentIQMemoryPanel = { renderMemories };
})();
  </script>

  <script>
// ================================================================
// 6. Settings Panel
// ================================================================
(function () {
  const Storage = window.SentIQStorage;
  const chatLimitInput = document.getElementById("setting-chat-limit");
  const memoryLimitInput = document.getElementById("setting-memory-limit");
  const fileLimitInput = document.getElementById("setting-file-limit");
  const saveSettingsBtn = document.getElementById("save-settings-btn");
  const storageStats = document.getElementById("storage-stats");

  async function loadSettings() {
    const config = await Storage.getAllConfig();
    if (chatLimitInput) chatLimitInput.value = config.chat_limit;
    if (memoryLimitInput) memoryLimitInput.value = config.memory_limit;
    if (fileLimitInput) fileLimitInput.value = config.file_storage_mb;
    await renderStats();
  }

  async function renderStats() {
    if (!storageStats) return;
    const stats = await Storage.getStorageStats();
    storageStats.innerHTML = `
      <div class="stat-row"><span>Conversations</span><span>${stats.chats.count} / ${stats.chats.limit}</span></div>
      <div class="stat-row"><span>Memories</span><span>${stats.memories.count} / ${stats.memories.limit}</span></div>
      <div class="stat-row"><span>Files</span><span>${stats.files.count} (limit: ${stats.files.limit_mb} MB)</span></div>
    `;
  }

  saveSettingsBtn?.addEventListener("click", async () => {
    const chatLimit = parseInt(chatLimitInput?.value, 10);
    const memoryLimit = parseInt(memoryLimitInput?.value, 10);
    const fileLimit = parseInt(fileLimitInput?.value, 10);
    if (chatLimit > 0) await Storage.setConfig("chat_limit", chatLimit);
    if (memoryLimit > 0) await Storage.setConfig("memory_limit", memoryLimit);
    if (fileLimit > 0) await Storage.setConfig("file_storage_mb", fileLimit);
    await renderStats();
    saveSettingsBtn.textContent = "Saved ✓";
    setTimeout(() => (saveSettingsBtn.textContent = "Save Settings"), 1500);
  });

  const observer = new MutationObserver(() => {
    const modal = document.getElementById("settings-modal");
    if (modal && modal.style.display !== "none") loadSettings();
  });
  const modal = document.getElementById("settings-modal");
  if (modal) observer.observe(modal, { attributes: true, attributeFilter: ["style"] });

  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", loadSettings);
  else loadSettings();
})();
  </script>
