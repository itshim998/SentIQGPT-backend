<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="SentIQGPT — AI Assistant with chart generation, image generation, and persistent memory." />
  <title>SentIQGPT</title>

  <!-- Styles -->
  <link rel="stylesheet" href="styles/sentiqgpt.css" />

  <!--
    Markdown renderer (optional enhancement — falls back gracefully if unavailable)
    loaded from CDN for richly formatted assistant replies.
  -->
  <script
    src="https://cdn.jsdelivr.net/npm/marked@12.0.0/marked.min.js"
    crossorigin="anonymous"
    defer
  ></script>

  <!--
    Chart.js and Plotly are loaded on-demand by chart-renderer.js when a
    chart response arrives, to avoid loading them on every page load.
  -->
</head>
<body>

<!-- ═══════════════════════════════ App Layout ════════════════════════════════ -->
<div class="app-layout">

  <!-- ── Sidebar ── -->
  <aside class="sidebar" aria-label="Session list">
    <div class="sidebar-header">
      <a href="#" class="sidebar-logo" aria-label="SentIQGPT home">
        <div class="logo-icon" aria-hidden="true">✦</div>
        SentIQGPT
      </a>
      <button class="btn-new-chat" id="new-chat-btn" aria-label="Start new chat">
        <span aria-hidden="true">＋</span> New chat
      </button>
    </div>

    <nav class="sessions-list" id="sessions-list" aria-label="Chat sessions">
      <!-- Populated by chat-ui.js -->
    </nav>
  </aside>

  <!-- ── Main area ── -->
  <main class="main-area" role="main">

    <!-- Header -->
    <header class="chat-header">
      <span id="chat-title" class="chat-header-title">New Chat</span>
    </header>

    <!-- Messages -->
    <div
      class="messages-container"
      id="messages"
      role="log"
      aria-live="polite"
      aria-label="Chat messages"
    >
      <!-- Empty state shown by chat-ui.js on startup -->
    </div>

    <!-- Input -->
    <div class="input-area">
      <div class="input-box">
        <textarea
          id="chat-input"
          class="input-textarea"
          rows="1"
          placeholder="Message SentIQGPT… (Shift+Enter for new line)"
          aria-label="Chat message"
          autocomplete="off"
          autocorrect="off"
          spellcheck="true"
        ></textarea>
        <button
          id="send-btn"
          class="send-btn"
          aria-label="Send message"
          disabled
          title="Send (Enter)"
        >
          ↑
        </button>
      </div>
      <p class="input-hint">
        SentIQGPT can make mistakes. Verify important information independently.
      </p>
    </div>

  </main>
</div>

<!-- ══════════════ "Ask SentIQGPT" floating selection button ══════════════ -->
<!--
  This button is shown (on desktop only) when the user selects text inside
  the chat messages area.  text-selection.js controls its visibility.
  On mobile the CSS and JS both ensure it is never shown.
-->
<button
  id="ask-sentiqgpt-btn"
  aria-label="Ask SentIQGPT about selected text"
  title="Ask SentIQGPT about selected text"
>
  <span aria-hidden="true">✦</span> Ask SentIQGPT
</button>

<!-- ══════════════════════════════ Scripts ════════════════════════════════ -->
<!--
  Load order matters:
    1. storage-manager  — IndexedDB abstraction (no external deps)
    2. api-client       — Backend HTTP calls (no external deps)
    3. chart-renderer   — Chart rendering (Plotly / Chart.js loaded on demand)
    4. text-selection   — Text selection floating button (desktop only)
    5. chat-ui          — Main controller (depends on 1-4 and optional marked.js)
-->
<script src="scripts/storage-manager.js"></script>
<script src="scripts/api-client.js"></script>
<script src="scripts/chart-renderer.js"></script>
<script src="scripts/text-selection.js"></script>
<script src="scripts/chat-ui.js"></script>

</body>
</html>
