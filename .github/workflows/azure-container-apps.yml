name: Deploy Azure Container App

on:
  push:
    branches:
      - master
    paths-ignore:
      - "frontend/**"
      - "docs/**"
      - "*.md"
      - "AZURE_DEPLOYMENT_GUIDE.md"
      - "DOCKER_GUIDE.md"
      - "ENVIRONMENT_VARIABLES.md"
  workflow_dispatch:
    inputs:
      image_tag:
        description: Existing immutable image tag to deploy without rebuilding. Leave blank to build the current commit.
        required: false
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: azure-container-apps-production
  cancel-in-progress: false

env:
  AZURE_CORE_OUTPUT: none
  IMAGE_REPOSITORY: sentiqgpt-backend

jobs:
  build-and-deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    if: github.event_name != 'workflow_dispatch' || inputs.image_tag == ''

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure login
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Azure Container Registry
        run: az acr login --name "${{ vars.AZURE_ACR_NAME }}"

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ vars.AZURE_ACR_LOGIN_SERVER }}/${{ env.IMAGE_REPOSITORY }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy immutable image to Azure Container Apps
        run: |
          az containerapp update \
            --name "${{ vars.AZURE_CONTAINER_APP_NAME }}" \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --image "${{ vars.AZURE_ACR_LOGIN_SERVER }}/${{ env.IMAGE_REPOSITORY }}:${{ github.sha }}" \
            --revision-suffix "${GITHUB_SHA::12}"

  rollback:
    name: Deploy existing image tag
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && inputs.image_tag != ''

    steps:
      - name: Azure login
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy selected immutable image to Azure Container Apps
        env:
          IMAGE_TAG: ${{ inputs.image_tag }}
        run: |
          set -euo pipefail
          suffix="$(printf '%s' "${IMAGE_TAG}" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9-]/-/g' | cut -c1-20)"
          suffix="${suffix:-manual}"
          az containerapp update \
            --name "${{ vars.AZURE_CONTAINER_APP_NAME }}" \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --image "${{ vars.AZURE_ACR_LOGIN_SERVER }}/${{ env.IMAGE_REPOSITORY }}:${IMAGE_TAG}" \
            --revision-suffix "rollback-${suffix}"
