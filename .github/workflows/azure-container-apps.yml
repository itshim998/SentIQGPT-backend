name: Deploy Azure Container App

on:
  push:
    branches:
      - master
    paths-ignore:
      - "frontend/**"
      - "docs/**"
      - "*.md"
      - "AZURE_DEPLOYMENT_GUIDE.md"
      - "DOCKER_GUIDE.md"
      - "ENVIRONMENT_VARIABLES.md"
  workflow_dispatch:
    inputs:
      image_tag:
        description: Existing immutable image tag to deploy without rebuilding. Leave blank to build the current commit.
        required: false
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: azure-container-apps-production
  cancel-in-progress: false

env:
  AZURE_CORE_OUTPUT: none
  # Azure backend image/resource identifier remains unchanged until a verified replacement exists.
  IMAGE_REPOSITORY: sentiqgpt-backend
  SENTIQ_CONTAINER_MIN_REPLICAS: ${{ vars.SENTIQ_CONTAINER_MIN_REPLICAS || '0' }}
  SENTIQ_CONTAINER_MAX_REPLICAS: ${{ vars.SENTIQ_CONTAINER_MAX_REPLICAS || '1' }}
  SENTIQ_CONTAINER_COOLDOWN_SECONDS: ${{ vars.SENTIQ_CONTAINER_COOLDOWN_SECONDS || '900' }}

jobs:
  build-and-deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    if: github.event_name != 'workflow_dispatch' || inputs.image_tag == ''

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure login
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Validate Container App runtime gates
        shell: bash
        run: |
          set -euo pipefail
          target_port="$(az containerapp show \
            --name "${{ vars.AZURE_CONTAINER_APP_NAME }}" \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --query 'properties.configuration.ingress.targetPort' \
            -o tsv)"
          if [[ "${target_port}" != "3001" ]]; then
            echo "Azure Container App ingress targetPort must remain 3001."
            exit 1
          fi

          internal_token_secret_ref="$(az containerapp show \
            --name "${{ vars.AZURE_CONTAINER_APP_NAME }}" \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --query "properties.template.containers[0].env[?name=='SENTIQ_INTERNAL_SERVICE_TOKEN'].secretRef | [0]" \
            -o tsv)"
          if [[ -z "${internal_token_secret_ref}" || "${internal_token_secret_ref}" == "None" ]]; then
            echo "SENTIQ_INTERNAL_SERVICE_TOKEN must be mapped from an Azure Container Apps secret before deployment."
            exit 1
          fi

          unsafe_internal_endpoints="$(az containerapp show \
            --name "${{ vars.AZURE_CONTAINER_APP_NAME }}" \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --query "properties.template.containers[0].env[?name=='SENTIQ_ENABLE_UNSAFE_INTERNAL_ENDPOINTS'].value | [0]" \
            -o tsv)"
          if [[ "${unsafe_internal_endpoints}" == "true" ]]; then
            echo "Unsafe internal endpoints cannot be enabled in production."
            exit 1
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Azure Container Registry
        run: az acr login --name "${{ vars.AZURE_ACR_NAME }}"

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ vars.AZURE_ACR_LOGIN_SERVER }}/${{ env.IMAGE_REPOSITORY }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy immutable image to Azure Container Apps
        shell: bash
        env:
          DEPLOY_IMAGE: ${{ vars.AZURE_ACR_LOGIN_SERVER }}/${{ env.IMAGE_REPOSITORY }}:${{ github.sha }}
        run: |
          set -euo pipefail
          current_config="${RUNNER_TEMP}/sentiq-container-app-current.json"
          update_config="${RUNNER_TEMP}/sentiq-container-app-update.yaml"
          trap 'rm -f "${current_config}" "${update_config}"' EXIT

          az containerapp show \
            --name "${{ vars.AZURE_CONTAINER_APP_NAME }}" \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            -o json > "${current_config}"

          node scripts/renderAzureContainerAppUpdate.mjs \
            --input "${current_config}" \
            --output "${update_config}" \
            --container-name "${IMAGE_REPOSITORY}" \
            --image "${DEPLOY_IMAGE}" \
            --revision-suffix "${GITHUB_SHA::12}" \
            --min-replicas "${SENTIQ_CONTAINER_MIN_REPLICAS}" \
            --max-replicas "${SENTIQ_CONTAINER_MAX_REPLICAS}" \
            --cooldown-seconds "${SENTIQ_CONTAINER_COOLDOWN_SECONDS}" \
            --readiness-path "/ready"

          az containerapp update \
            --name "${{ vars.AZURE_CONTAINER_APP_NAME }}" \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --yaml "${update_config}"

          actual_min="$(az containerapp show --name "${{ vars.AZURE_CONTAINER_APP_NAME }}" --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" --query 'properties.template.scale.minReplicas' -o tsv)"
          actual_max="$(az containerapp show --name "${{ vars.AZURE_CONTAINER_APP_NAME }}" --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" --query 'properties.template.scale.maxReplicas' -o tsv)"
          actual_cooldown="$(az containerapp show --name "${{ vars.AZURE_CONTAINER_APP_NAME }}" --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" --query 'properties.template.scale.cooldownPeriod' -o tsv)"
          readiness_path="$(az containerapp show --name "${{ vars.AZURE_CONTAINER_APP_NAME }}" --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" --query "properties.template.containers[0].probes[?type=='Readiness'].httpGet.path | [0]" -o tsv)"
          readiness_failures="$(az containerapp show --name "${{ vars.AZURE_CONTAINER_APP_NAME }}" --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" --query "properties.template.containers[0].probes[?type=='Readiness'].failureThreshold | [0]" -o tsv)"
          if [[ "${actual_min}" != "${SENTIQ_CONTAINER_MIN_REPLICAS}" || "${actual_max}" != "${SENTIQ_CONTAINER_MAX_REPLICAS}" || "${actual_cooldown}" != "${SENTIQ_CONTAINER_COOLDOWN_SECONDS}" ]]; then
            echo "Azure Container App scale verification failed."
            exit 1
          fi
          if [[ "${readiness_path}" != "/ready" || "${readiness_failures}" != "2" ]]; then
            echo "Azure Container App readiness probe verification failed."
            exit 1
          fi
          echo "Azure Container App scale active: min=${actual_min}, max=${actual_max}, cooldown=${actual_cooldown}."

  rollback:
    name: Deploy existing image tag
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && inputs.image_tag != ''

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure login
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Validate Container App runtime gates
        shell: bash
        run: |
          set -euo pipefail
          target_port="$(az containerapp show \
            --name "${{ vars.AZURE_CONTAINER_APP_NAME }}" \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --query 'properties.configuration.ingress.targetPort' \
            -o tsv)"
          if [[ "${target_port}" != "3001" ]]; then
            echo "Azure Container App ingress targetPort must remain 3001."
            exit 1
          fi

          internal_token_secret_ref="$(az containerapp show \
            --name "${{ vars.AZURE_CONTAINER_APP_NAME }}" \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --query "properties.template.containers[0].env[?name=='SENTIQ_INTERNAL_SERVICE_TOKEN'].secretRef | [0]" \
            -o tsv)"
          if [[ -z "${internal_token_secret_ref}" || "${internal_token_secret_ref}" == "None" ]]; then
            echo "SENTIQ_INTERNAL_SERVICE_TOKEN must be mapped from an Azure Container Apps secret before deployment."
            exit 1
          fi

          unsafe_internal_endpoints="$(az containerapp show \
            --name "${{ vars.AZURE_CONTAINER_APP_NAME }}" \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --query "properties.template.containers[0].env[?name=='SENTIQ_ENABLE_UNSAFE_INTERNAL_ENDPOINTS'].value | [0]" \
            -o tsv)"
          if [[ "${unsafe_internal_endpoints}" == "true" ]]; then
            echo "Unsafe internal endpoints cannot be enabled in production."
            exit 1
          fi

      - name: Deploy selected immutable image to Azure Container Apps
        shell: bash
        env:
          IMAGE_TAG: ${{ inputs.image_tag }}
        run: |
          set -euo pipefail
          suffix="$(printf '%s' "${IMAGE_TAG}" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9-]/-/g' | cut -c1-20)"
          suffix="${suffix:-manual}"
          current_config="${RUNNER_TEMP}/sentiq-container-app-current.json"
          update_config="${RUNNER_TEMP}/sentiq-container-app-update.yaml"
          trap 'rm -f "${current_config}" "${update_config}"' EXIT

          az containerapp show \
            --name "${{ vars.AZURE_CONTAINER_APP_NAME }}" \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            -o json > "${current_config}"

          node scripts/renderAzureContainerAppUpdate.mjs \
            --input "${current_config}" \
            --output "${update_config}" \
            --container-name "${IMAGE_REPOSITORY}" \
            --image "${{ vars.AZURE_ACR_LOGIN_SERVER }}/${IMAGE_REPOSITORY}:${IMAGE_TAG}" \
            --revision-suffix "rollback-${suffix}" \
            --min-replicas "${SENTIQ_CONTAINER_MIN_REPLICAS}" \
            --max-replicas "${SENTIQ_CONTAINER_MAX_REPLICAS}" \
            --cooldown-seconds "${SENTIQ_CONTAINER_COOLDOWN_SECONDS}" \
            --readiness-path "/health"

          az containerapp update \
            --name "${{ vars.AZURE_CONTAINER_APP_NAME }}" \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --yaml "${update_config}"

          actual_min="$(az containerapp show --name "${{ vars.AZURE_CONTAINER_APP_NAME }}" --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" --query 'properties.template.scale.minReplicas' -o tsv)"
          actual_max="$(az containerapp show --name "${{ vars.AZURE_CONTAINER_APP_NAME }}" --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" --query 'properties.template.scale.maxReplicas' -o tsv)"
          actual_cooldown="$(az containerapp show --name "${{ vars.AZURE_CONTAINER_APP_NAME }}" --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" --query 'properties.template.scale.cooldownPeriod' -o tsv)"
          readiness_path="$(az containerapp show --name "${{ vars.AZURE_CONTAINER_APP_NAME }}" --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" --query "properties.template.containers[0].probes[?type=='Readiness'].httpGet.path | [0]" -o tsv)"
          readiness_failures="$(az containerapp show --name "${{ vars.AZURE_CONTAINER_APP_NAME }}" --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" --query "properties.template.containers[0].probes[?type=='Readiness'].failureThreshold | [0]" -o tsv)"
          if [[ "${actual_min}" != "${SENTIQ_CONTAINER_MIN_REPLICAS}" || "${actual_max}" != "${SENTIQ_CONTAINER_MAX_REPLICAS}" || "${actual_cooldown}" != "${SENTIQ_CONTAINER_COOLDOWN_SECONDS}" ]]; then
            echo "Azure Container App scale verification failed."
            exit 1
          fi
          if [[ "${readiness_path}" != "/health" || "${readiness_failures}" != "2" ]]; then
            echo "Azure Container App rollback readiness probe verification failed."
            exit 1
          fi
          echo "Azure Container App scale active: min=${actual_min}, max=${actual_max}, cooldown=${actual_cooldown}."
