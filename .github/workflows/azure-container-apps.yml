name: Deploy Azure Container App

on:
  push:
    branches:
      - master
    paths-ignore:
      - "frontend/**"
      - "docs/**"
      - "*.md"
      - "AZURE_DEPLOYMENT_GUIDE.md"
      - "DOCKER_GUIDE.md"
      - "ENVIRONMENT_VARIABLES.md"
  workflow_dispatch:
    inputs:
      image_tag:
        description: Existing immutable image tag to deploy without rebuilding. Leave blank to build the current commit.
        required: false
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: azure-container-apps-production
  cancel-in-progress: false

env:
  IMAGE_REPOSITORY: sentiqgpt-backend

jobs:
  build-and-deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    if: github.event_name != 'workflow_dispatch' || inputs.image_tag == ''

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Azure login
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Install verified Container Apps CLI extension
        run: >-
          az extension add
          --name containerapp
          --version 1.3.0b4
          --upgrade
          --only-show-errors
          --output none

      - name: Prove last-ready runtime and determine deployment source
        id: preflight
        shell: bash
        env:
          APP_NAME: ${{ vars.AZURE_CONTAINER_APP_NAME }}
          RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
        run: |
          set -Eeuo pipefail
          mode="$(az containerapp show \
            --name "${APP_NAME}" \
            --resource-group "${RESOURCE_GROUP}" \
            --query 'properties.configuration.activeRevisionsMode' \
            -o tsv)"
          [[ "${mode,,}" == "single" || "${mode,,}" == "multiple" ]] || {
            echo 'Unsupported Azure revision mode.'
            exit 1
          }
          echo "Verified Azure revision mode: ${mode}; multiple mode will not skip ordinary deployment."

          target_port="$(az containerapp show \
            --name "${APP_NAME}" \
            --resource-group "${RESOURCE_GROUP}" \
            --query 'properties.configuration.ingress.targetPort' \
            -o tsv)"
          latest_ready="$(az containerapp show \
            --name "${APP_NAME}" \
            --resource-group "${RESOURCE_GROUP}" \
            --query 'properties.latestReadyRevisionName' \
            -o tsv)"
          fqdn="$(az containerapp show \
            --name "${APP_NAME}" \
            --resource-group "${RESOURCE_GROUP}" \
            --query 'properties.configuration.ingress.fqdn' \
            -o tsv)"
          [[ "${target_port}" == "3001" && -n "${latest_ready}" && -n "${fqdn}" ]] || {
            echo 'Last-ready Azure production metadata is incomplete.'
            exit 1
          }

          source_health="$(az containerapp revision show \
            --name "${APP_NAME}" \
            --resource-group "${RESOURCE_GROUP}" \
            --revision "${latest_ready}" \
            --query 'properties.healthState' \
            -o tsv 2>/dev/null || true)"
          [[ "${source_health}" == "Healthy" ]] || {
            echo "Last-ready source revision ${latest_ready} is not healthy."
            exit 1
          }

          readiness_path="$(az containerapp revision show \
            --name "${APP_NAME}" \
            --resource-group "${RESOURCE_GROUP}" \
            --revision "${latest_ready}" \
            --query "properties.template.containers[0].probes[?type=='Readiness'].httpGet.path | [0]" \
            -o tsv)"
          [[ "${readiness_path}" == "/ready" ]] || {
            echo 'Last-ready revision does not use the production /ready gate.'
            exit 1
          }

          internal_ref="$(az containerapp revision show \
            --name "${APP_NAME}" \
            --resource-group "${RESOURCE_GROUP}" \
            --revision "${latest_ready}" \
            --query "properties.template.containers[0].env[?name=='SENTIQ_INTERNAL_SERVICE_TOKEN'].secretRef | [0]" \
            -o tsv)"
          [[ -n "${internal_ref}" && "${internal_ref}" != "None" ]] || {
            echo 'SENTIQ_INTERNAL_SERVICE_TOKEN is not a secret reference on the last-ready revision.'
            exit 1
          }
          resolved_ref_count="$(az containerapp secret list \
            --name "${APP_NAME}" \
            --resource-group "${RESOURCE_GROUP}" \
            --query "[?name=='${internal_ref}'] | length(@)" \
            -o tsv)"
          [[ "${resolved_ref_count}" == "1" ]] || {
            echo 'SENTIQ_INTERNAL_SERVICE_TOKEN secret reference is unresolved.'
            exit 1
          }

          if [[ "${mode,,}" == "single" ]]; then
            ready_status=0
            for attempt in $(seq 1 90); do
              ready_status="$(curl \
                --silent \
                --output /dev/null \
                --write-out '%{http_code}' \
                --max-time 15 \
                "https://${fqdn}/ready" || true)"
              [[ "${ready_status}" == "200" ]] && break
              sleep 2
            done
            [[ "${ready_status}" == "200" ]] || {
              echo 'Last-ready production failed /ready.'
              exit 1
            }
          fi

          replica="$(az containerapp replica list \
            --name "${APP_NAME}" \
            --resource-group "${RESOURCE_GROUP}" \
            --revision "${latest_ready}" \
            --query '[0].name' \
            -o tsv 2>/dev/null || true)"
          if [[ -n "${replica}" ]]; then
            runtime_command="$(node scripts/verifyAzureRuntimeEnvironment.mjs --emit-command)"
            runtime_log="${RUNNER_TEMP}/ordinary-deploy-runtime-${GITHUB_RUN_ID}.log"
            trap 'rm -f "${runtime_log}"' EXIT
            bash scripts/execAzureContainerAppCommand.sh \
              --name "${APP_NAME}" \
              --resource-group "${RESOURCE_GROUP}" \
              --revision "${latest_ready}" \
              --replica "${replica}" \
              --container "${IMAGE_REPOSITORY}" \
              --command "${runtime_command}" | tee "${runtime_log}"
            grep -a '"event": "azure_runtime_environment"' "${runtime_log}" \
              | tail -1 \
              | jq -e '.ok == true' >/dev/null
          elif [[ "${mode,,}" == "single" ]]; then
            echo 'Last-ready production has no running replica.'
            exit 1
          fi

          echo "deploy=true" >> "${GITHUB_OUTPUT}"
          echo "previous_revision=${latest_ready}" >> "${GITHUB_OUTPUT}"
          echo "fqdn=${fqdn}" >> "${GITHUB_OUTPUT}"
          echo "mode=${mode,,}" >> "${GITHUB_OUTPUT}"

      - name: Set up Docker Buildx
        if: steps.preflight.outputs.deploy == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Log in to Azure Container Registry
        if: steps.preflight.outputs.deploy == 'true'
        run: az acr login --name "${{ vars.AZURE_ACR_NAME }}"

      - name: Build and push immutable image
        if: steps.preflight.outputs.deploy == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ vars.AZURE_ACR_LOGIN_SERVER }}/${{ env.IMAGE_REPOSITORY }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Copy last-ready revision with the immutable image
        if: steps.preflight.outputs.deploy == 'true'
        shell: bash
        env:
          APP_NAME: ${{ vars.AZURE_CONTAINER_APP_NAME }}
          RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
          PREVIOUS_REVISION: ${{ steps.preflight.outputs.previous_revision }}
          FQDN: ${{ steps.preflight.outputs.fqdn }}
          MODE: ${{ steps.preflight.outputs.mode }}
          DEPLOY_IMAGE: ${{ vars.AZURE_ACR_LOGIN_SERVER }}/${{ env.IMAGE_REPOSITORY }}:${{ github.sha }}
        run: |
          set -Eeuo pipefail
          suffix="${GITHUB_SHA::12}"
          new_revision="${APP_NAME}--${suffix}"
          mode="${MODE:-$(az containerapp show --name "${APP_NAME}" --resource-group "${RESOURCE_GROUP}" --query 'properties.configuration.activeRevisionsMode' -o tsv)}"
          mode="${mode,,}"

          az containerapp revision copy \
            --name "${APP_NAME}" \
            --resource-group "${RESOURCE_GROUP}" \
            --from-revision "${PREVIOUS_REVISION}" \
            --container-name "${IMAGE_REPOSITORY}" \
            --image "${DEPLOY_IMAGE}" \
            --revision-suffix "${suffix}" \
            --only-show-errors \
            --output none

          candidate_ready=0
          for attempt in $(seq 1 120); do
            health="$(az containerapp revision show \
              --name "${APP_NAME}" \
              --resource-group "${RESOURCE_GROUP}" \
              --revision "${new_revision}" \
              --query 'properties.healthState' \
              -o tsv 2>/dev/null || true)"
            if [[ "${mode}" == "multiple" ]]; then
              candidate_fqdn="$(az containerapp revision show \
                --name "${APP_NAME}" \
                --resource-group "${RESOURCE_GROUP}" \
                --revision "${new_revision}" \
                --query 'properties.fqdn' \
                -o tsv 2>/dev/null || true)"
              candidate_status="$(curl \
                --silent \
                --output /dev/null \
                --write-out '%{http_code}' \
                --max-time 15 \
                "https://${candidate_fqdn}/ready" || true)"
              if [[ "${health}" == "Healthy" && "${candidate_status}" == "200" ]]; then
                candidate_ready=1
                break
              fi
            else
              latest_ready="$(az containerapp show \
                --name "${APP_NAME}" \
                --resource-group "${RESOURCE_GROUP}" \
                --query 'properties.latestReadyRevisionName' \
                -o tsv 2>/dev/null || true)"
              ready_status="$(curl \
                --silent \
                --output /dev/null \
                --write-out '%{http_code}' \
                --max-time 15 \
                "https://${FQDN}/ready" || true)"
              if [[ "${latest_ready}" == "${new_revision}" \
                && "${health}" == "Healthy" \
                && "${ready_status}" == "200" ]]; then
                candidate_ready=1
                break
              fi
            fi
            sleep 3
          done
          [[ "${candidate_ready}" == "1" ]] || {
            echo 'Candidate revision failed verification and received no intentional traffic.'
            exit 1
          }

          deployed_image="$(az containerapp revision show \
            --name "${APP_NAME}" \
            --resource-group "${RESOURCE_GROUP}" \
            --revision "${new_revision}" \
            --query "properties.template.containers[?name=='${IMAGE_REPOSITORY}'].image | [0]" \
            -o tsv)"
          [[ "${deployed_image}" == "${DEPLOY_IMAGE}" ]] || {
            echo 'Deployed image does not match the immutable commit tag.'
            exit 1
          }

          if [[ "${mode}" == "multiple" ]]; then
            az containerapp ingress traffic set \
              --name "${APP_NAME}" \
              --resource-group "${RESOURCE_GROUP}" \
              --revision-weight "${PREVIOUS_REVISION}=0" "${new_revision}=100" \
              --only-show-errors \
              --output none
          fi

          public_ready=0
          for attempt in $(seq 1 30); do
            public_status="$(curl \
              --silent \
              --output /dev/null \
              --write-out '%{http_code}' \
              --max-time 15 \
              "https://${FQDN}/ready" || true)"
            if [[ "${public_status}" == "200" ]]; then
              public_ready=1
              break
            fi
            sleep 2
          done

          if [[ "${public_ready}" != "1" ]]; then
            if [[ "${mode}" == "multiple" ]]; then
              echo 'Public /ready verification failed after activation; restoring traffic to previous revision.'
              az containerapp ingress traffic set \
                --name "${APP_NAME}" \
                --resource-group "${RESOURCE_GROUP}" \
                --revision-weight "${PREVIOUS_REVISION}=100" "${new_revision}=0" \
                --only-show-errors \
                --output none || true
            fi
            echo 'Azure Container App did not pass public /ready after activation.'
            exit 1
          fi
          echo "Azure Container App deployed safely on ${new_revision}; previous revision remains available."

  rollback:
    name: Deploy existing image tag
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && inputs.image_tag != ''

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Azure login
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Install verified Container Apps CLI extension
        run: >-
          az extension add
          --name containerapp
          --version 1.3.0b4
          --upgrade
          --only-show-errors
          --output none

      - name: Copy exact last-ready configuration with selected image
        shell: bash
        env:
          APP_NAME: ${{ vars.AZURE_CONTAINER_APP_NAME }}
          RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
          IMAGE_TAG: ${{ inputs.image_tag }}
          FQDN: ${{ vars.AZURE_CONTAINER_APP_FQDN }}
        run: |
          set -Eeuo pipefail
          previous_revision="$(az containerapp show \
            --name "${APP_NAME}" \
            --resource-group "${RESOURCE_GROUP}" \
            --query 'properties.latestReadyRevisionName' \
            -o tsv)"
          mode="$(az containerapp show \
            --name "${APP_NAME}" \
            --resource-group "${RESOURCE_GROUP}" \
            --query 'properties.configuration.activeRevisionsMode' \
            -o tsv)"
          fqdn="$(az containerapp show \
            --name "${APP_NAME}" \
            --resource-group "${RESOURCE_GROUP}" \
            --query 'properties.configuration.ingress.fqdn' \
            -o tsv)"
          [[ -n "${previous_revision}" && -n "${fqdn}" ]] || {
            echo 'No last-ready revision is available for the selected image deployment.'
            exit 1
          }
          suffix="rollback-${GITHUB_RUN_ID}"
          new_revision="${APP_NAME}--${suffix}"
          deploy_image="${{ vars.AZURE_ACR_LOGIN_SERVER }}/${IMAGE_REPOSITORY}:${IMAGE_TAG}"

          az containerapp revision copy \
            --name "${APP_NAME}" \
            --resource-group "${RESOURCE_GROUP}" \
            --from-revision "${previous_revision}" \
            --container-name "${IMAGE_REPOSITORY}" \
            --image "${deploy_image}" \
            --revision-suffix "${suffix}" \
            --only-show-errors \
            --output none

          revision_ready=0
          for attempt in $(seq 1 120); do
            health="$(az containerapp revision show \
              --name "${APP_NAME}" \
              --resource-group "${RESOURCE_GROUP}" \
              --revision "${new_revision}" \
              --query 'properties.healthState' \
              -o tsv 2>/dev/null || true)"
            revision_fqdn="$(az containerapp revision show \
              --name "${APP_NAME}" \
              --resource-group "${RESOURCE_GROUP}" \
              --revision "${new_revision}" \
              --query 'properties.fqdn' \
              -o tsv 2>/dev/null || true)"
            revision_status="$(curl \
              --silent \
              --output /dev/null \
              --write-out '%{http_code}' \
              --max-time 15 \
              "https://${revision_fqdn}/ready" || true)"
            if [[ "${health}" == "Healthy" && "${revision_status}" == "200" ]]; then
              revision_ready=1
              break
            fi
            sleep 3
          done
          [[ "${revision_ready}" == "1" ]] || {
            echo 'Selected image revision failed verification and received no intentional traffic.'
            exit 1
          }

          if [[ "${mode,,}" == "multiple" ]]; then
            az containerapp ingress traffic set \
              --name "${APP_NAME}" \
              --resource-group "${RESOURCE_GROUP}" \
              --revision-weight "${previous_revision}=0" "${new_revision}=100" \
              --only-show-errors \
              --output none
          fi
          public_status="$(curl \
            --silent \
            --output /dev/null \
            --write-out '%{http_code}' \
            --max-time 30 \
            "https://${fqdn}/ready")"
          [[ "${public_status}" == "200" ]] || {
            echo 'Selected image did not pass public /ready after activation.'
            exit 1
          }
          echo "Selected immutable image deployed on ${new_revision}; previous revision remains available."
