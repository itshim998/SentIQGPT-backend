name: Deploy Azure Container App

on:
  push:
    branches:
      - master
    paths-ignore:
      - "frontend/**"
      - "docs/**"
      - "*.md"
      - "AZURE_DEPLOYMENT_GUIDE.md"
      - "DOCKER_GUIDE.md"
      - "ENVIRONMENT_VARIABLES.md"
  workflow_dispatch:
    inputs:
      image_tag:
        description: Existing immutable image tag to deploy without rebuilding. Leave blank to build the current commit.
        required: false
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: azure-container-apps-production
  cancel-in-progress: false

env:
  AZURE_CORE_OUTPUT: none
  IMAGE_REPOSITORY: sentiqgpt-backend

jobs:
  build-and-deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    if: github.event_name != 'workflow_dispatch' || inputs.image_tag == ''

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure login
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Verify production internal gateway configuration
        shell: bash
        run: |
          set -euo pipefail
          target_port="$(az containerapp show --name "${{ vars.AZURE_CONTAINER_APP_NAME }}" --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" --query "properties.configuration.ingress.targetPort" -o tsv)"
          token_secret_ref="$(az containerapp show --name "${{ vars.AZURE_CONTAINER_APP_NAME }}" --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" --query "properties.template.containers[0].env[?name=='SENTIQ_INTERNAL_SERVICE_TOKEN'].secretRef | [0]" -o tsv)"
          node_env="$(az containerapp show --name "${{ vars.AZURE_CONTAINER_APP_NAME }}" --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" --query "properties.template.containers[0].env[?name=='NODE_ENV'].value | [0]" -o tsv)"
          llm_host="$(az containerapp show --name "${{ vars.AZURE_CONTAINER_APP_NAME }}" --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" --query "properties.template.containers[0].env[?name=='LLM_SERVICE_HOST'].value | [0]" -o tsv)"
          llm_url="$(az containerapp show --name "${{ vars.AZURE_CONTAINER_APP_NAME }}" --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" --query "properties.template.containers[0].env[?name=='LLM_SERVICE_URL'].value | [0]" -o tsv)"
          unsafe_override="$(az containerapp show --name "${{ vars.AZURE_CONTAINER_APP_NAME }}" --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" --query "properties.template.containers[0].env[?name=='SENTIQ_ENABLE_UNSAFE_INTERNAL_ENDPOINTS'].value | [0]" -o tsv)"

          [[ "${target_port}" == "3001" ]] || { echo "::error::Azure ingress must target Node port 3001"; exit 1; }
          [[ -n "${token_secret_ref}" && "${token_secret_ref}" != "null" && "${token_secret_ref}" != "None" ]] || { echo "::error::SENTIQ_INTERNAL_SERVICE_TOKEN must use an Azure secretRef"; exit 1; }
          [[ "${node_env}" == "production" ]] || { echo "::error::NODE_ENV must be production"; exit 1; }
          [[ "${llm_host}" == "127.0.0.1" ]] || { echo "::error::LLM_SERVICE_HOST must remain on loopback"; exit 1; }
          [[ "${llm_url}" == "http://127.0.0.1:3002" ]] || { echo "::error::LLM_SERVICE_URL must remain on the internal loopback service"; exit 1; }
          [[ "${unsafe_override,,}" != "true" ]] || { echo "::error::Unsafe internal endpoints cannot be enabled in production"; exit 1; }
          echo "Production internal gateway configuration verified."

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Azure Container Registry
        run: az acr login --name "${{ vars.AZURE_ACR_NAME }}"

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ vars.AZURE_ACR_LOGIN_SERVER }}/${{ env.IMAGE_REPOSITORY }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy immutable image to Azure Container Apps
        run: |
          az containerapp update \
            --name "${{ vars.AZURE_CONTAINER_APP_NAME }}" \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --image "${{ vars.AZURE_ACR_LOGIN_SERVER }}/${{ env.IMAGE_REPOSITORY }}:${{ github.sha }}" \
            --revision-suffix "${GITHUB_SHA::12}"

  rollback:
    name: Deploy existing image tag
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && inputs.image_tag != ''

    steps:
      - name: Azure login
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Verify production internal gateway configuration
        shell: bash
        run: |
          set -euo pipefail
          target_port="$(az containerapp show --name "${{ vars.AZURE_CONTAINER_APP_NAME }}" --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" --query "properties.configuration.ingress.targetPort" -o tsv)"
          token_secret_ref="$(az containerapp show --name "${{ vars.AZURE_CONTAINER_APP_NAME }}" --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" --query "properties.template.containers[0].env[?name=='SENTIQ_INTERNAL_SERVICE_TOKEN'].secretRef | [0]" -o tsv)"
          node_env="$(az containerapp show --name "${{ vars.AZURE_CONTAINER_APP_NAME }}" --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" --query "properties.template.containers[0].env[?name=='NODE_ENV'].value | [0]" -o tsv)"
          llm_host="$(az containerapp show --name "${{ vars.AZURE_CONTAINER_APP_NAME }}" --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" --query "properties.template.containers[0].env[?name=='LLM_SERVICE_HOST'].value | [0]" -o tsv)"
          llm_url="$(az containerapp show --name "${{ vars.AZURE_CONTAINER_APP_NAME }}" --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" --query "properties.template.containers[0].env[?name=='LLM_SERVICE_URL'].value | [0]" -o tsv)"
          unsafe_override="$(az containerapp show --name "${{ vars.AZURE_CONTAINER_APP_NAME }}" --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" --query "properties.template.containers[0].env[?name=='SENTIQ_ENABLE_UNSAFE_INTERNAL_ENDPOINTS'].value | [0]" -o tsv)"

          [[ "${target_port}" == "3001" ]] || { echo "::error::Azure ingress must target Node port 3001"; exit 1; }
          [[ -n "${token_secret_ref}" && "${token_secret_ref}" != "null" && "${token_secret_ref}" != "None" ]] || { echo "::error::SENTIQ_INTERNAL_SERVICE_TOKEN must use an Azure secretRef"; exit 1; }
          [[ "${node_env}" == "production" ]] || { echo "::error::NODE_ENV must be production"; exit 1; }
          [[ "${llm_host}" == "127.0.0.1" ]] || { echo "::error::LLM_SERVICE_HOST must remain on loopback"; exit 1; }
          [[ "${llm_url}" == "http://127.0.0.1:3002" ]] || { echo "::error::LLM_SERVICE_URL must remain on the internal loopback service"; exit 1; }
          [[ "${unsafe_override,,}" != "true" ]] || { echo "::error::Unsafe internal endpoints cannot be enabled in production"; exit 1; }
          echo "Production internal gateway configuration verified."

      - name: Deploy selected immutable image to Azure Container Apps
        env:
          IMAGE_TAG: ${{ inputs.image_tag }}
        run: |
          set -euo pipefail
          suffix="$(printf '%s' "${IMAGE_TAG}" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9-]/-/g' | cut -c1-20)"
          suffix="${suffix:-manual}"
          az containerapp update \
            --name "${{ vars.AZURE_CONTAINER_APP_NAME }}" \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --image "${{ vars.AZURE_ACR_LOGIN_SERVER }}/${{ env.IMAGE_REPOSITORY }}:${IMAGE_TAG}" \
            --revision-suffix "rollback-${suffix}"
