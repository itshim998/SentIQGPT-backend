name: Context Awareness

on:
  workflow_dispatch:
    inputs:
      enforce_targets:
        description: Enforce the future contextual-awareness target gates
        required: false
        default: false
        type: boolean
  pull_request:
    paths:
      - "backend/context/**"
      - "backend/orchestrator/contextComposer.ts"
      - "backend/services/sourceRetrievalService.ts"
      - "backend/services/fastContextSnapshotService.ts"
      - "backend/ai/FileIngestionHandler.ts"
      - "backend/testContextAwarenessPhase0.ts"
      - "backend/testContextAwarenessPhase1.ts"
      - "backend/testFastContextSnapshot.ts"
      - "backend/testContextComposition.ts"
      - "backend/testProtectedContextSafety.ts"
      - "supabase/migrations/*fast_context_snapshot*.sql"
      - "docs/context-awareness/**"
      - ".github/workflows/context-awareness-phase0.yml"

permissions:
  contents: read

jobs:
  contextual-awareness:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SENTIQ_CONTEXT_EVAL_REPORT: artifacts/context-awareness-phase-0.json
      SENTIQ_CONTEXT_EVAL_ENFORCE_TARGETS: ${{ inputs.enforce_targets == true && '1' || '0' }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build backend
        run: npm run build

      - name: Run canonical context-budget regressions
        run: npm run test:context-budget

      - name: Run protected-context safety regressions
        run: npm run test:protected-context-safety

      - name: Run Phase 0 evaluator
        run: |
          mkdir -p artifacts
          npx ts-node --project tsconfig.backend.json backend/testContextAwarenessPhase0.ts

      - name: Run Phase 1 query-aware policy regressions
        run: npx ts-node --project tsconfig.backend.json backend/testContextAwarenessPhase1.ts

      - name: Run Phase 2 Fast snapshot regressions
        run: npx ts-node --project tsconfig.backend.json backend/testFastContextSnapshot.ts

      - name: Upload evaluation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: context-awareness-phase-0-${{ github.sha }}
          path: artifacts/context-awareness-phase-0.json
          if-no-files-found: warn
          retention-days: 30
