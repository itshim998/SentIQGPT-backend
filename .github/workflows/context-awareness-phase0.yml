name: Context Awareness

on:
  workflow_dispatch:
    inputs:
      enforce_targets:
        description: Enforce the future contextual-awareness target gates
        required: false
        default: false
        type: boolean
  pull_request:
    paths:
      - "backend/context/**"
      - "backend/orchestrator/contextComposer.ts"
      - "backend/services/sourceRetrievalService.ts"
      - "backend/services/fastContextSnapshotService.ts"
      - "backend/services/longPdfPersistenceService.ts"
      - "backend/ai/FileIngestionHandler.ts"
      - "backend/ai/pdfCanonicalSourceRegistry.ts"
      - "backend/testContextAwarenessPhase0.ts"
      - "backend/testContextAwarenessPhase1.ts"
      - "backend/testFastContextSnapshot.ts"
      - "backend/testLongPdfIngestion.ts"
      - "backend/testStrongSourceRetrieval.ts"
      - "backend/testStrongSourceRetrieval.sql"
      - "backend/testStrongSourceRetrievalV2.sql"
      - "backend/testStrongSourceRetrievalV3.sql"
      - "backend/testPhase5ExistingReadyBackfill.sql"
      - "backend/testContextComposition.ts"
      - "backend/testProtectedContextSafety.ts"
      - "supabase/migrations/*fast_context_snapshot*.sql"
      - "supabase/migrations/*long_pdf_ingestion*.sql"
      - "supabase/migrations/*source_fts_retrieval*.sql"
      - "supabase/migrations/*phase5*.sql"
      - "docs/context-awareness/**"
      - ".github/workflows/context-awareness-phase0.yml"

permissions:
  contents: read

jobs:
  contextual-awareness:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      SENTIQ_CONTEXT_EVAL_REPORT: artifacts/context-awareness-phase-0.json
      SENTIQ_CONTEXT_EVAL_ENFORCE_TARGETS: ${{ inputs.enforce_targets == true && '1' || '0' }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build backend
        run: npm run build

      - name: Run canonical context-budget regressions
        run: npm run test:context-budget

      - name: Run protected-context safety regressions
        run: npm run test:protected-context-safety

      - name: Run source retrieval regressions
        run: npm run test:source-retrieval

      - name: Run Phase 0 evaluator
        run: |
          mkdir -p artifacts
          npx ts-node --project tsconfig.backend.json backend/testContextAwarenessPhase0.ts

      - name: Run Phase 1 query-aware policy regressions
        run: npx ts-node --project tsconfig.backend.json backend/testContextAwarenessPhase1.ts

      - name: Run Phase 2 Fast snapshot regressions
        run: npx ts-node --project tsconfig.backend.json backend/testFastContextSnapshot.ts

      - name: Run Phase 4 long PDF ingestion regressions
        run: npx ts-node --project tsconfig.backend.json backend/testLongPdfIngestion.ts

      - name: Run Phase 5 strong PostgreSQL FTS regressions
        run: npx ts-node --project tsconfig.backend.json backend/testStrongSourceRetrieval.ts

      - name: Run Phase 5 live PostgreSQL integration
        env:
          PGPASSWORD: postgres
        run: |
          awk '
            { print }
            /20260805100200_fix_phase5_ready_trigger.sql/ {
              print "\\i supabase/migrations/20260805100250_prepare_phase5_safe_backfill.sql"
            }
            /20260805100300_fix_phase5_map_ambiguity.sql/ {
              print "\\i supabase/migrations/20260805100400_fix_phase5_search_rpc_ambiguity.sql"
              print "\\i supabase/migrations/20260805100500_fix_phase5_ready_trigger_recursion.sql"
              print "\\i supabase/migrations/20260805100600_fix_phase5_sentence_regex.sql"
            }
          ' backend/testStrongSourceRetrievalV3.sql \
            > /tmp/testStrongSourceRetrievalV4.sql
          grep -F '\i supabase/migrations/20260805100250_prepare_phase5_safe_backfill.sql' \
            /tmp/testStrongSourceRetrievalV4.sql
          grep -F '\i supabase/migrations/20260805100400_fix_phase5_search_rpc_ambiguity.sql' \
            /tmp/testStrongSourceRetrievalV4.sql
          grep -F '\i supabase/migrations/20260805100500_fix_phase5_ready_trigger_recursion.sql' \
            /tmp/testStrongSourceRetrievalV4.sql
          grep -F '\i supabase/migrations/20260805100600_fix_phase5_sentence_regex.sql' \
            /tmp/testStrongSourceRetrievalV4.sql

          set +e
          psql -h 127.0.0.1 -U postgres -d postgres \
            -v ON_ERROR_STOP=1 \
            -f /tmp/testStrongSourceRetrievalV4.sql \
            > /tmp/phase5-postgres.log 2>&1
          phase5_status=$?
          set -e
          cat /tmp/phase5-postgres.log

          if [ "$phase5_status" -ne 0 ]; then
            phase5_error=$(grep -E '^(psql:|ERROR:|DETAIL:|HINT:|CONTEXT:)' \
              /tmp/phase5-postgres.log \
              | tail -n 30 \
              | tr '\n' ' ' \
              | sed 's/%/%25/g; s/\r/%0D/g')
            if [ -z "$phase5_error" ]; then
              phase5_error=$(tail -n 24 /tmp/phase5-postgres.log \
                | tr '\n' ' ' \
                | sed 's/%/%25/g; s/\r/%0D/g')
            fi
            echo "::error file=backend/testStrongSourceRetrievalV3.sql,title=Phase 5 PostgreSQL failure::$phase5_error"
            exit "$phase5_status"
          fi

      - name: Run Phase 5 existing-ready backfill integration
        env:
          PGPASSWORD: postgres
        run: |
          dropdb -h 127.0.0.1 -U postgres --if-exists sentiq_phase5_existing
          createdb -h 127.0.0.1 -U postgres sentiq_phase5_existing
          psql -h 127.0.0.1 -U postgres -d sentiq_phase5_existing \
            -v ON_ERROR_STOP=1 \
            -f backend/testPhase5ExistingReadyBackfill.sql

      - name: Upload evaluation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: context-awareness-phase-0-${{ github.sha }}
          path: artifacts/context-awareness-phase-0.json
          if-no-files-found: warn
          retention-days: 30
