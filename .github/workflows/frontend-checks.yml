name: Frontend checks

on:
  pull_request:
    paths:
      - "frontend/**"
      - "scripts/minimizeFrontendStartupHang.mjs"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/frontend-checks.yml"
  push:
    branches:
      - master
      - "ui/**"
    paths:
      - "frontend/**"
      - "scripts/minimizeFrontendStartupHang.mjs"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/frontend-checks.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frontend-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  startup-delta-debug:
    name: Minimize blocked frontend startup
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install browser diagnostic harness
        run: npm install --no-save --ignore-scripts puppeteer-core@24.16.0
      - name: Delta-debug DOM side effects
        id: delta_debug
        shell: bash
        run: |
          set -o pipefail
          node scripts/minimizeFrontendStartupHang.mjs 2>&1 | tee frontend-startup-delta-debug.log
      - name: Upload delta-debug result
        if: always() && steps.delta_debug.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: frontend-startup-delta-debug-${{ github.run_id }}
          path: frontend-startup-delta-debug.log
          if-no-files-found: error
          retention-days: 2
