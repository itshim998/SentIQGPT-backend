name: Frontend checks

on:
  pull_request:
    paths:
      - "frontend/**"
      - "scripts/checkFrontendSyntax.mjs"
      - "scripts/frontendBootstrapDomAliases.cjs"
      - "scripts/runFrontendBootstrapCheck.mjs"
      - "scripts/runFrontendChecks.mjs"
      - "scripts/runFrontendUiStateTests.mjs"
      - "scripts/testFrontendRuntimeSmoke.mjs"
      - "scripts/testFrontendUiStabilityRuntime.mjs"
      - "scripts/testLongThreadScrollRuntime.mjs"
      - "scripts/testPriorityPolishRuntime.mjs"
      - "scripts/verifyFrontendDeployment.mjs"
      - "scripts/testDeployedFrontendRuntime.mjs"
      - "backend/frontendSource.ts"
      - "backend/testFrontendBootstrap.ts"
      - "backend/testFrontendFileGeneration.ts"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.backend.json"
      - ".github/workflows/frontend-checks.yml"
  push:
    branches:
      - master
      - "ui/**"
    paths:
      - "frontend/**"
      - "scripts/checkFrontendSyntax.mjs"
      - "scripts/frontendBootstrapDomAliases.cjs"
      - "scripts/runFrontendBootstrapCheck.mjs"
      - "scripts/runFrontendChecks.mjs"
      - "scripts/runFrontendUiStateTests.mjs"
      - "scripts/testFrontendRuntimeSmoke.mjs"
      - "scripts/testFrontendUiStabilityRuntime.mjs"
      - "scripts/testLongThreadScrollRuntime.mjs"
      - "scripts/testPriorityPolishRuntime.mjs"
      - "scripts/verifyFrontendDeployment.mjs"
      - "scripts/testDeployedFrontendRuntime.mjs"
      - "backend/frontendSource.ts"
      - "backend/testFrontendBootstrap.ts"
      - "backend/testFrontendFileGeneration.ts"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.backend.json"
      - ".github/workflows/frontend-checks.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frontend-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend-checks:
    name: Syntax, lifecycle, UI state, billing, and runtime
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Frontend syntax
        run: npm run check:frontend-syntax

      - name: Frontend bootstrap
        id: frontend_bootstrap
        shell: bash
        run: |
          set -o pipefail
          npm run test:frontend-bootstrap 2>&1 | tee frontend-bootstrap.log

      - name: Upload bootstrap failure log
        if: failure() && steps.frontend_bootstrap.outcome == 'failure'
        uses: actions/upload-artifact@v7
        with:
          name: frontend-bootstrap-failure-${{ github.run_id }}
          path: frontend-bootstrap.log
          if-no-files-found: error
          retention-days: 2

      - name: Frontend file generation
        run: npm run test:frontend-file-generation

      - name: Frontend tool lifecycle
        run: npm run test:frontend-tool-lifecycle

      - name: Frontend billing
        run: npm run test:frontend-billing

      - name: Focused UI state
        id: frontend_ui_state
        shell: bash
        run: |
          set -o pipefail
          npm run test:frontend-ui-state 2>&1 | tee frontend-ui-state.log

      - name: Upload focused UI-state failure log
        if: failure() && steps.frontend_ui_state.outcome == 'failure'
        uses: actions/upload-artifact@v7
        with:
          name: frontend-ui-state-failure-${{ github.run_id }}
          path: frontend-ui-state.log
          if-no-files-found: error
          retention-days: 2

      - name: Install browser smoke harness
        run: npm install --no-save --package-lock=false --ignore-scripts puppeteer-core@24.16.0

      - name: Chromium runtime smoke
        id: frontend_runtime
        shell: bash
        run: |
          set -o pipefail
          node scripts/testFrontendRuntimeSmoke.mjs 2>&1 | tee frontend-runtime.log
          node scripts/testFrontendUiStabilityRuntime.mjs 2>&1 | tee -a frontend-runtime.log
          node scripts/testLongThreadScrollRuntime.mjs 2>&1 | tee -a frontend-runtime.log
          node scripts/testPriorityPolishRuntime.mjs 2>&1 | tee -a frontend-runtime.log

      - name: Upload runtime failure log
        if: failure() && steps.frontend_runtime.outcome == 'failure'
        uses: actions/upload-artifact@v7
        with:
          name: frontend-runtime-failure-${{ github.run_id }}
          path: frontend-runtime.log
          if-no-files-found: error
          retention-days: 2

      - name: Verify deployed branch revision
        if: github.event_name == 'push' && github.ref == 'refs/heads/ui/sentiq-liquid-glass-v4'
        id: frontend_deployment_verify
        shell: bash
        run: |
          set -o pipefail
          node scripts/verifyFrontendDeployment.mjs 2>&1 | tee frontend-deployment-verify.log

      - name: Upload deployment verification failure log
        if: failure() && steps.frontend_deployment_verify.outcome == 'failure'
        uses: actions/upload-artifact@v7
        with:
          name: frontend-deployment-verification-failure-${{ github.run_id }}
          path: frontend-deployment-verify.log
          if-no-files-found: error
          retention-days: 2

      - name: Deployed Pages Chromium smoke
        if: github.event_name == 'push' && github.ref == 'refs/heads/ui/sentiq-liquid-glass-v4'
        id: frontend_deployed_runtime
        shell: bash
        run: |
          set -o pipefail
          node scripts/testDeployedFrontendRuntime.mjs 2>&1 | tee frontend-deployed-runtime.log

      - name: Upload deployed runtime failure evidence
        if: failure() && steps.frontend_deployed_runtime.outcome == 'failure'
        uses: actions/upload-artifact@v7
        with:
          name: frontend-deployed-runtime-failure-${{ github.run_id }}
          path: |
            frontend-deployed-runtime.log
            frontend-live-runtime-failure.png
          if-no-files-found: warn
          retention-days: 2
