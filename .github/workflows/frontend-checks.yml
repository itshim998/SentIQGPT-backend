name: Frontend checks

on:
  pull_request:
    paths:
      - "frontend/**"
      - "scripts/checkFrontendSyntax.mjs"
      - "scripts/frontendBootstrapDomAliases.cjs"
      - "scripts/runFrontendBootstrapCheck.mjs"
      - "scripts/runFrontendChecks.mjs"
      - "scripts/runFrontendUiStateTests.mjs"
      - "backend/frontendSource.ts"
      - "backend/testFrontendBootstrap.ts"
      - "backend/testFrontendFileGeneration.ts"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.backend.json"
      - ".github/workflows/frontend-checks.yml"
  push:
    branches:
      - master
      - "ui/**"
    paths:
      - "frontend/**"
      - "scripts/checkFrontendSyntax.mjs"
      - "scripts/frontendBootstrapDomAliases.cjs"
      - "scripts/runFrontendBootstrapCheck.mjs"
      - "scripts/runFrontendChecks.mjs"
      - "scripts/runFrontendUiStateTests.mjs"
      - "backend/frontendSource.ts"
      - "backend/testFrontendBootstrap.ts"
      - "backend/testFrontendFileGeneration.ts"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.backend.json"
      - ".github/workflows/frontend-checks.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frontend-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend-checks:
    name: Syntax, lifecycle, UI state, and billing
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Frontend syntax
        run: npm run check:frontend-syntax

      - name: Frontend bootstrap
        id: frontend_bootstrap
        shell: bash
        run: |
          set -o pipefail
          npm run test:frontend-bootstrap 2>&1 | tee frontend-bootstrap.log

      - name: Upload bootstrap failure log
        if: failure() && steps.frontend_bootstrap.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: frontend-bootstrap-failure-${{ github.run_id }}
          path: frontend-bootstrap.log
          if-no-files-found: error
          retention-days: 2

      - name: Frontend file generation
        run: npm run test:frontend-file-generation

      - name: Frontend tool lifecycle
        run: npm run test:frontend-tool-lifecycle

      - name: Frontend billing
        run: npm run test:frontend-billing

      - name: Focused UI state
        id: frontend_ui_state
        shell: bash
        run: |
          set -o pipefail
          npm run test:frontend-ui-state 2>&1 | tee frontend-ui-state.log

      - name: Upload focused UI-state failure log
        if: failure() && steps.frontend_ui_state.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: frontend-ui-state-failure-${{ github.run_id }}
          path: frontend-ui-state.log
          if-no-files-found: error
          retention-days: 2
