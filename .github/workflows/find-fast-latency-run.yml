name: Find Fast latency master run

on:
  pull_request:
    paths:
      - ".github/workflows/find-fast-latency-run.yml"

permissions:
  contents: read
  actions: read

jobs:
  find:
    name: List trusted Fast baseline runs
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: List matching master runs
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -Eeuo pipefail
          # Refreshed after the controlled full-rollout trigger.
          runs="$(gh run list \
            --repo "${GITHUB_REPOSITORY}" \
            --workflow fast-latency-production-baseline.yml \
            --branch master \
            --event push \
            --limit 10 \
            --json databaseId,headSha,status,conclusion,url,createdAt)"
          jq . <<<"${runs}"
          jq -e --arg sha "${EXPECTED_SHA}" '.[] | select(.headSha == $sha)' <<<"${runs}" >/dev/null
