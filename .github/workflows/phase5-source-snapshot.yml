name: Phase 5 source snapshot

on:
  push:
    branches:
      - feature/flutter-android-app
    paths:
      - .github/workflows/phase5-source-snapshot.yml

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/flutter-android-app

      - name: Package current Phase 5 source
        shell: bash
        run: |
          set -euo pipefail
          tar \
            --exclude='mobile/sentiq_chat/build' \
            --exclude='mobile/sentiq_chat/.dart_tool' \
            --exclude='node_modules' \
            -czf phase5-source.tar.gz \
            mobile/sentiq_chat \
            backend \
            frontend \
            docs/mobile \
            .github/workflows/flutter-android.yml \
            package.json \
            package-lock.json \
            tsconfig.json
          sha256sum phase5-source.tar.gz > phase5-source.tar.gz.sha256

      - name: Upload source snapshot
        uses: actions/upload-artifact@v4
        with:
          name: phase5-source-snapshot-${{ github.sha }}
          path: |
            phase5-source.tar.gz
            phase5-source.tar.gz.sha256
          retention-days: 1
          if-no-files-found: error
