name: Flutter Android

on:
  pull_request:
    paths:
      - "mobile/sentiq_chat/**"
      - "backend/mobile/**"
      - "backend/branding.ts"
      - "backend/testMobileContract.ts"
      - ".github/workflows/flutter-android.yml"
  push:
    branches:
      - "feature/flutter-android-app"
    paths:
      - "mobile/sentiq_chat/**"
      - "backend/mobile/**"
      - "backend/branding.ts"
      - "backend/testMobileContract.ts"
      - ".github/workflows/flutter-android.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: flutter-android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: "3.44.8"
  JAVA_VERSION: "17"

jobs:
  flutter-foundation:
    name: Analyze, test, contract replay, and debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: mobile/sentiq_chat

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up pinned Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Verify pinned toolchain
        run: |
          flutter --version
          test "$(cat .flutter-version)" = "${FLUTTER_VERSION}"

      - name: Generate Android platform scaffold
        run: ./tool/bootstrap_android.sh

      - name: Resolve dependencies
        run: flutter pub get

      - name: Format Dart sources
        run: dart format lib test

      - name: Static analysis
        run: flutter analyze

      - name: Unit and widget tests
        run: flutter test --coverage --exclude-tags contract

      - name: Contract fixture replay
        run: flutter test test/contracts/contract_fixture_replay_test.dart

      - name: Golden tests
        id: golden_tests
        run: flutter test test/goldens/foundation_palette_golden_test.dart

      - name: Upload golden failure evidence
        if: failure() && steps.golden_tests.outcome == 'failure'
        uses: actions/upload-artifact@v7
        with:
          name: flutter-golden-failures-${{ github.run_id }}
          path: mobile/sentiq_chat/test/failures/**
          if-no-files-found: warn
          retention-days: 7

      - name: Build Android debug APK
        run: flutter build apk --debug --dart-define=SENTIQ_ENV=development

      - name: Upload Android debug APK
        uses: actions/upload-artifact@v7
        with:
          name: sentiq-chat-android-debug-${{ github.sha }}
          path: mobile/sentiq_chat/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 7

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: flutter-coverage-${{ github.run_id }}
          path: mobile/sentiq_chat/coverage/lcov.info
          if-no-files-found: warn
          retention-days: 7

  backend-mobile-contract:
    name: Backend mobile contract regression
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Compile backend
        run: npm run build

      - name: Verify non-destructive mobile contract
        run: npx ts-node --project tsconfig.backend.json backend/testMobileContract.ts
