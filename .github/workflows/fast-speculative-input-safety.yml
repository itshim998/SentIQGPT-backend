name: Fast speculative input safety checks

on:
  pull_request:
    paths:
      - "backend/fast_speculative_input_safety.py"
      - "backend/testFastSpeculativeInputSafety.py"
      - "backend/run_llm_service.py"
      - "Dockerfile"
      - ".github/workflows/fast-speculative-input-safety.yml"
  push:
    branches:
      - master
    paths:
      - "backend/fast_speculative_input_safety.py"
      - "backend/testFastSpeculativeInputSafety.py"
      - "backend/run_llm_service.py"
      - "Dockerfile"
      - ".github/workflows/fast-speculative-input-safety.yml"

permissions:
  contents: read

jobs:
  contracts:
    name: No-release, cancellation, and packaging contracts
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install focused dependencies
        run: python -m pip install --disable-pip-version-check fastapi uvicorn

      - name: Compile speculative runtime
        run: |
          python -m py_compile \
            backend/fast_speculative_input_safety.py \
            backend/testFastSpeculativeInputSafety.py \
            backend/run_llm_service.py

      - name: Run speculative safety contracts
        run: python backend/testFastSpeculativeInputSafety.py

      - name: Verify production image contract
        run: |
          grep -Fq 'SENTIQ_FAST_PARALLEL_INPUT_SAFETY_ENABLED=true' Dockerfile
          grep -Fq 'backend/fast_speculative_input_safety.py' Dockerfile
          grep -Fq 'install_fast_speculative_input_safety(service)' backend/run_llm_service.py
