name: Apply Labs prompt handoff

on:
  push:
    branches: [master]
    paths:
      - .github/workflows/apply-labs-prompt-handoff.yml
      - scripts/add_labs_prompt_handoff.py

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install prompt handoff
        run: python scripts/add_labs_prompt_handoff.py

      - name: Verify frontend syntax and handoff contract
        run: |
          node --check frontend/scripts/features/chat-controller.js
          grep -F 'function consumePromptHandoff()' frontend/scripts/features/chat-controller.js
          grep -F 'await handleSend();' frontend/scripts/features/chat-controller.js
          grep -F 'window.history.replaceState' frontend/scripts/features/chat-controller.js

      - name: Commit prompt handoff
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/scripts/features/chat-controller.js
          git commit -m "Support prompt handoff from SentIQ Labs"
          git push
