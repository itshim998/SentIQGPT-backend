name: Finalize Phase 6

on:
  push:
    branches: [feature/flutter-android-app]
    paths: [.github/workflows/phase6-finalize.yml]
  workflow_dispatch:

permissions:
  contents: write

env:
  FLUTTER_VERSION: "3.44.8"
  JAVA_VERSION: "17"
  NODE_VERSION: "20"

jobs:
  finalize:
    name: Verify, test, package, and commit Phase 6
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - name: Checkout exact staging head
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Set up pinned Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Validate committed Phase 6 payload parts
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          parts=(tool/phase6-bundle.b64.part-*)
          test "${#parts[@]}" -eq 11
          printf '%s\n' "${parts[@]}"
          cat "${parts[@]}" > "${RUNNER_TEMP}/phase6-payload.b64"
          test -s "${RUNNER_TEMP}/phase6-payload.b64"

      - name: Decode Phase 6 payload
        shell: bash
        run: |
          set -euo pipefail
          base64 --decode "${RUNNER_TEMP}/phase6-payload.b64" > "${RUNNER_TEMP}/phase6-payload.tar.gz"
          test -s "${RUNNER_TEMP}/phase6-payload.tar.gz"

      - name: Verify Phase 6 archive integrity
        shell: bash
        run: |
          set -euo pipefail
          gzip -t "${RUNNER_TEMP}/phase6-payload.tar.gz"
          tar -tzf "${RUNNER_TEMP}/phase6-payload.tar.gz" >/dev/null

      - name: Extract committed Phase 6 payload
        shell: bash
        run: |
          set -euo pipefail
          tar -xzf "${RUNNER_TEMP}/phase6-payload.tar.gz" -C .
          if [[ -f .phase6-deletions.txt ]]; then
            while IFS= read -r path; do
              [[ -z "${path}" ]] || rm -f -- "${path}"
            done < .phase6-deletions.txt
            rm -f .phase6-deletions.txt
          fi

      - name: Verify required Phase 6 payload contents
        shell: bash
        run: |
          set -euo pipefail
          test -f .github/workflows/flutter-android-release.yml
          test -f docs/mobile/flutter-phase6-release-readiness.md
          test -f docs/mobile/phase6-performance-report.md
          test -f docs/mobile/phase6-feature-parity-checklist.md
          test -f docs/mobile/phase6-known-limitations.md
          test -f docs/mobile/android-studio-final-testing.md
          test ! -e mobile/sentiq_chat/lib/features/foundation/presentation/foundation_gallery_screen.dart

      - name: Prepare dependencies and deterministic lockfiles
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y libsqlite3-0
          npm install --package-lock-only --ignore-scripts
          npm ci
          cd mobile/sentiq_chat
          ./tool/bootstrap_android.sh
          flutter pub get
          dart format lib test integration_test
          flutter test --update-goldens test/goldens

      - name: Analyze and run complete Flutter verification
        shell: bash
        working-directory: mobile/sentiq_chat
        run: |
          set -euo pipefail
          dart format --output=none --set-exit-if-changed lib test integration_test
          flutter analyze
          flutter test --dart-define=SENTIQ_LOW_PERFORMANCE=true test/core/performance/low_performance_smoke_test.dart
          flutter test --coverage test/core test/features test/widgets
          flutter test test/integration
          flutter test test/contracts/contract_fixture_replay_test.dart
          flutter test test/goldens

      - name: Run backend compatibility and dependency security gates
        shell: bash
        run: |
          set -euo pipefail
          npm audit --audit-level=high
          npm run build
          npx ts-node --project tsconfig.backend.json backend/testMobileContract.ts
          npm run test:deep-research
          npm run test:live
          npm run billing:test-quota
          npm run test:stream-lifecycle
          npm run test:protected-context-safety

      - name: Verify source security and release boundaries
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git ls-files 'mobile/sentiq_chat/android/key.properties' 'mobile/sentiq_chat/android/**/*.jks' 'mobile/sentiq_chat/android/**/*.keystore')"
          ! git grep -nEI '(service[_-]?role[^[:space:]]*[=:][[:space:]]*[A-Za-z0-9._-]{20,}|sk_live_[A-Za-z0-9]+|rzp_live_[A-Za-z0-9]+|BEGIN (RSA |EC )?PRIVATE KEY)' -- mobile/sentiq_chat .github/workflows/flutter-android-release.yml
          test "$(grep -RIl 'package:url_launcher/url_launcher.dart' mobile/sentiq_chat/lib | wc -l)" -eq 1
          grep -q 'android:usesCleartextTraffic="false"' mobile/sentiq_chat/android/app/src/main/AndroidManifest.xml
          ! grep -q 'android.permission.CAMERA' mobile/sentiq_chat/android/app/src/main/AndroidManifest.xml
          grep -q 'android.permission.RECORD_AUDIO' mobile/sentiq_chat/android/app/src/main/AndroidManifest.xml
          grep -q 'isMinifyEnabled = true' mobile/sentiq_chat/android/app/build.gradle.kts
          grep -q 'isShrinkResources = true' mobile/sentiq_chat/android/app/build.gradle.kts
          ! grep -RInE '\b(print|debugPrint)\s*\(' mobile/sentiq_chat/lib
          ! git grep -nEI '(TODO|FIXME|HACK|XXX|coming soon|lorem ipsum)' -- mobile/sentiq_chat/lib mobile/sentiq_chat/android docs/mobile

      - name: Build and verify signed minified release APK and AAB
        shell: bash
        working-directory: mobile/sentiq_chat
        run: |
          set -euo pipefail
          ci_password="$(openssl rand -hex 20)"
          echo "::add-mask::${ci_password}"
          keytool -genkeypair -v \
            -keystore "${RUNNER_TEMP}/sentiq-phase6-ci.jks" \
            -storepass "${ci_password}" \
            -keypass "${ci_password}" \
            -alias sentiq_phase6_ci \
            -keyalg RSA \
            -keysize 3072 \
            -validity 30 \
            -dname "CN=SentIQ Phase 6 CI,O=SentIQ AI Labs,C=IN" >/dev/null 2>&1
          cat > android/key.properties <<KEYS
          storePassword=${ci_password}
          keyPassword=${ci_password}
          keyAlias=sentiq_phase6_ci
          storeFile=${RUNNER_TEMP}/sentiq-phase6-ci.jks
          KEYS
          flutter build apk --release --dart-define=SENTIQ_ENV=production
          flutter build appbundle --release --dart-define=SENTIQ_ENV=production
          test -f build/app/outputs/flutter-apk/app-release.apk
          test -f build/app/outputs/bundle/release/app-release.aab
          test -f build/app/outputs/mapping/release/mapping.txt
          apksigner="$(find "${ANDROID_HOME}/build-tools" -type f -name apksigner | sort -V | tail -1)"
          "${apksigner}" verify --verbose --print-certs build/app/outputs/flutter-apk/app-release.apk | tee "${RUNNER_TEMP}/phase6-finalizer-apk-signature.txt"
          grep -q 'SentIQ Phase 6 CI' "${RUNNER_TEMP}/phase6-finalizer-apk-signature.txt"
          jarsigner -verify -strict build/app/outputs/bundle/release/app-release.aab >/dev/null
          rm -f android/key.properties "${RUNNER_TEMP}/sentiq-phase6-ci.jks"
          test ! -e android/key.properties

      - name: Remove one-time Phase 6 machinery and commit verified tree
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/phase6-finalize.yml
          rm -f .github/workflows/phase6-audit.yml
          rm -f .github/workflows/phase6-source-snapshot.yml
          rm -f tool/phase6-bundle.b64.part-*
          rm -f .phase6-deletions.txt
          test ! -e .github/workflows/phase6-finalize.yml
          test ! -e .github/workflows/phase6-audit.yml
          test ! -e .github/workflows/phase6-source-snapshot.yml
          ! compgen -G 'tool/phase6-bundle.b64.part-*' >/dev/null
          test -f .github/workflows/flutter-android-release.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && { echo 'No Phase 6 changes to commit'; exit 1; }
          git commit -m 'Complete Phase 6 Android release readiness'
          git push origin HEAD:feature/flutter-android-app
          echo "PHASE6_COMMIT=$(git rev-parse HEAD)" >> "${GITHUB_ENV}"

      - name: Upload finalizer release evidence
        uses: actions/upload-artifact@v7
        with:
          name: sentiq-chat-phase6-finalizer-${{ env.PHASE6_COMMIT }}
          path: |
            mobile/sentiq_chat/build/app/outputs/flutter-apk/app-release.apk
            mobile/sentiq_chat/build/app/outputs/bundle/release/app-release.aab
            mobile/sentiq_chat/build/app/outputs/mapping/release/mapping.txt
            mobile/sentiq_chat/coverage/lcov.info
            ${{ runner.temp }}/phase6-finalizer-apk-signature.txt
          if-no-files-found: error
          retention-days: 14
