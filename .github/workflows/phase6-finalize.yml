name: Finalize Phase 6

on:
  push:
    branches: [feature/flutter-android-app]
    paths: [.github/workflows/phase6-finalize.yml]
  workflow_dispatch:

permissions:
  contents: write

env:
  NODE_VERSION: "20"

jobs:
  dependency-security:
    name: Repair and verify backend dependency security
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Apply safe dependency repairs
        shell: bash
        run: |
          set -euo pipefail
          npm pkg set 'dependencies.sharp=^0.35.3'
          npm pkg set 'overrides.uuid=11.1.1'
          npm install --package-lock-only --ignore-scripts
          npm audit fix --ignore-scripts
          npm install --package-lock-only --ignore-scripts

      - name: Prove dependency security
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm audit --audit-level=high

      - name: Run backend compatibility suite
        shell: bash
        run: |
          set -euo pipefail
          npm run build
          npx ts-node --project tsconfig.backend.json backend/testMobileContract.ts
          npm run test:deep-research
          npm run test:live
          npm run billing:test-quota
          npm run test:stream-lifecycle
          npm run test:protected-context-safety

      - name: Commit verified dependency lock
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json package-lock.json
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'Dependency tree already secure; nothing to commit.'
            exit 0
          fi
          git commit -m 'Harden backend dependencies for Android release'
          git push origin HEAD:feature/flutter-android-app
