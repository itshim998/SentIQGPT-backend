name: Temporary generation tests

on:
  push:
    branches:
      - integration/durable-chat-master-reconciled
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generation-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Distributed integration suite
        run: npm run test:generation-distributed
      - name: Guest durability contract
        run: npx ts-node --project tsconfig.backend.json backend/testGuestGenerationDurabilityP0.ts
      - name: P0 hardening contract
        run: npx ts-node --project tsconfig.backend.json backend/testGenerationP0Hardening.ts
      - name: Generation phase contracts
        run: |
          npx ts-node --project tsconfig.backend.json backend/testGenerationPhase11Phase12Contracts.ts
          npx ts-node --project tsconfig.backend.json backend/testGenerationPhase15Phase16Contracts.ts
          npx ts-node --project tsconfig.backend.json backend/testGenerationPhase19Phase20Contracts.ts
          npx ts-node --project tsconfig.backend.json backend/testGenerationPhase21Contracts.ts
          npx ts-node --project tsconfig.backend.json backend/testGenerationRunnerContract.ts
          npx ts-node --project tsconfig.backend.json backend/testGenerationSessionPhase13Phase14Contracts.ts
