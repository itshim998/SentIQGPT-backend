name: Package verified Phase 5 artifacts

on:
  push:
    branches: [feature/flutter-android-app]
    paths: [.github/workflows/phase5-artifacts.yml]

permissions:
  contents: read

concurrency:
  group: phase5-artifacts-feature-flutter-android-app
  cancel-in-progress: true

env:
  FLUTTER_VERSION: "3.44.8"
  JAVA_VERSION: "17"

jobs:
  package:
    name: Reverify permanent tree and package Phase 5
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: mobile/sentiq_chat
    steps:
      - name: Checkout permanent Phase 5 tree
        uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up pinned Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install SQLite runtime
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-0

      - name: Bootstrap Android
        run: ./tool/bootstrap_android.sh

      - name: Resolve dependencies
        run: flutter pub get

      - name: Analyze permanent Phase 5 tree
        run: flutter analyze

      - name: Regenerate Phase 5 coverage
        run: flutter test --coverage test/core test/features test/widgets

      - name: Build verified Android debug APK
        run: flutter build apk --debug --dart-define=SENTIQ_ENV=development

      - name: Upload Phase 5 APK
        uses: actions/upload-artifact@v7
        with:
          name: sentiq-chat-phase5-debug-${{ github.sha }}
          path: mobile/sentiq_chat/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 7

      - name: Upload Phase 5 coverage
        uses: actions/upload-artifact@v7
        with:
          name: sentiq-chat-phase5-coverage-${{ github.run_id }}
          path: mobile/sentiq_chat/coverage/lcov.info
          if-no-files-found: error
          retention-days: 7
