name: Apply paid image text-routing Pass 2

on:
  push:
    branches:
      - fix/plan-tier-image-routing-pass1
    paths:
      - scripts/applyPaidImageTextRoutingPass2.mjs
      - .github/workflows/apply-paid-image-text-routing-pass2.yml

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout branch
        uses: actions/checkout@v6
        with:
          ref: fix/plan-tier-image-routing-pass1
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Apply exact source transformations
        run: node scripts/applyPaidImageTextRoutingPass2.mjs

      - name: Validate patch whitespace
        run: git diff --check

      - name: Install dependencies
        run: |
          npm ci
          python -m pip install --disable-pip-version-check requests python-dotenv

      - name: Compile and run focused contracts
        run: |
          npm run build
          npm run test:model-tool-contract
          npm run test:model-tool-transport
          npm run test:model-tool-execution
          npm run test:image-routing-safety
          npx ts-node --project tsconfig.backend.json backend/testPaidImageTextRouting.ts
          python backend/testExpandedModelToolProviders.py
          python -m py_compile llm_adapter.py backend/nvidia_nemotron.py

      - name: Commit implementation
        shell: bash
        run: |
          set -Eeuo pipefail
          if git diff --quiet; then
            echo "No implementation changes were required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            .env.example \
            .env.template \
            backend \
            docs/BILLING_AND_PRICING.md \
            llm_adapter.py
          git commit -m "Add model-decided paid image text routing"
          git push origin HEAD:fix/plan-tier-image-routing-pass1
