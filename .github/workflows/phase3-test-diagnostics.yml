name: Phase 3 test diagnostics

on:
  push:
    branches:
      - feature/flutter-android-app
    paths:
      - ".github/workflows/phase3-test-diagnostics.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: phase3-test-diagnostics-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: "3.44.8"
  JAVA_VERSION: "17"

jobs:
  rich-text:
    name: Full native rich-text fixture
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Prepare and canonicalize Flutter sources
        working-directory: mobile/sentiq_chat
        run: |
          ./tool/bootstrap_android.sh
          flutter pub get
          dart format lib test
      - name: Commit canonical formatter and lockfile output
        run: |
          if ! git diff --quiet mobile/sentiq_chat/lib mobile/sentiq_chat/test mobile/sentiq_chat/pubspec.lock; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add mobile/sentiq_chat/lib mobile/sentiq_chat/test mobile/sentiq_chat/pubspec.lock
            git commit -m "Canonicalize native rich-text rendering"
            git push origin HEAD:${GITHUB_REF_NAME}
          fi
      - name: Static analysis
        working-directory: mobile/sentiq_chat
        run: flutter analyze
      - name: Run complete rich-text fixture
        working-directory: mobile/sentiq_chat
        run: timeout 3m flutter test --reporter expanded --timeout 90s test/features/chat/native_rich_text_fixture_test.dart
