name: Phase 3 test diagnostics

on:
  push:
    branches:
      - feature/flutter-android-app
    paths:
      - ".github/workflows/phase3-test-diagnostics.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phase3-test-diagnostics-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: "3.44.8"
  JAVA_VERSION: "17"

jobs:
  chat-file:
    name: ${{ matrix.label }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Composer
            test_file: test/features/chat/chat_composer_test.dart
          - label: Controller continuity
            test_file: test/features/chat/chat_controller_continuity_test.dart
          - label: Long-thread virtualization
            test_file: test/features/chat/chat_message_virtualization_test.dart
          - label: Reconciliation
            test_file: test/features/chat/chat_reconciliation_test.dart
          - label: Native rich text
            test_file: test/features/chat/native_rich_text_fixture_test.dart
          - label: Token batching
            test_file: test/features/chat/token_batcher_test.dart
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Prepare Flutter
        working-directory: mobile/sentiq_chat
        run: |
          ./tool/bootstrap_android.sh
          flutter pub get
      - name: Run isolated chat test
        working-directory: mobile/sentiq_chat
        run: timeout 3m flutter test --reporter expanded --timeout 90s "${{ matrix.test_file }}"
