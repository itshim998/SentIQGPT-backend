name: Phase 3 test diagnostics

on:
  push:
    branches:
      - feature/flutter-android-app
    paths:
      - ".github/workflows/phase3-test-diagnostics.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phase3-test-diagnostics-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: "3.44.8"
  JAVA_VERSION: "17"

jobs:
  native-rich-text-input:
    name: Native rich text — ${{ matrix.scenario }}
    runs-on: ubuntu-latest
    timeout-minutes: 6
    strategy:
      fail-fast: false
      matrix:
        scenario:
          - inline-math
          - display-math
          - code-block
          - complete
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Prepare Flutter
        working-directory: mobile/sentiq_chat
        run: |
          ./tool/bootstrap_android.sh
          flutter pub get
      - name: Write character-code renderer probe
        working-directory: mobile/sentiq_chat
        env:
          SCENARIO: ${{ matrix.scenario }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path

          scenario = os.environ['SCENARIO']
          values = {
              'inline-math': r'Inline $a^2+b^2=c^2$.',
              'display-math': 'Before\n\n$$\\int_0^1 x^2 dx = \\frac{1}{3}$$\n\nAfter',
              'code-block': '```dart\nvoid main() {}\n```',
              'complete': Path('test/fixtures/rich_text/complete.md').read_text(),
          }
          value = values[scenario]
          points = ','.join(str(ord(char)) for char in value)
          source = f"""import 'package:flutter/material.dart';
          import 'package:flutter_test/flutter_test.dart';
          import 'package:sentiq_chat/core/design_system/sentiq_theme.dart';
          import 'package:sentiq_chat/features/chat/presentation/native_rich_text.dart';

          void main() {{
            testWidgets('{scenario}', (WidgetTester tester) async {{
              final String value = String.fromCharCodes(<int>[{points}]);
              await tester.pumpWidget(MaterialApp(
                theme: SentIQTheme.light(),
                home: Scaffold(body: SingleChildScrollView(
                  child: NativeRichText(data: value),
                )),
              ));
              await tester.pump();
              expect(tester.takeException(), isNull);
            }});
          }}
          """
          Path('test/tmp_phase3_native_rich_text_probe_test.dart').write_text(source)
          PY
      - name: Run production renderer probe
        working-directory: mobile/sentiq_chat
        run: timeout 2m flutter test --reporter expanded --timeout 90s test/tmp_phase3_native_rich_text_probe_test.dart
