name: Phase 3 test diagnostics

on:
  push:
    branches:
      - feature/flutter-android-app
    paths:
      - ".github/workflows/phase3-test-diagnostics.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phase3-test-diagnostics-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: "3.44.8"
  JAVA_VERSION: "17"

jobs:
  rich-text-layer:
    name: ${{ matrix.scenario }}
    runs-on: ubuntu-latest
    timeout-minutes: 6
    strategy:
      fail-fast: false
      matrix:
        scenario:
          - plain-markdown
          - selection-markdown
          - direct-math
          - latex-markdown-adapter
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Prepare Flutter
        working-directory: mobile/sentiq_chat
        run: |
          ./tool/bootstrap_android.sh
          flutter pub get
      - name: Write isolated rendering probe
        working-directory: mobile/sentiq_chat
        env:
          SCENARIO: ${{ matrix.scenario }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path

          scenario = os.environ['SCENARIO']
          imports = """import 'package:flutter/material.dart';
          import 'package:flutter_test/flutter_test.dart';
          import 'package:flutter_markdown_plus/flutter_markdown_plus.dart';
          import 'package:flutter_markdown_plus_latex/flutter_markdown_plus_latex.dart';
          import 'package:flutter_math_fork/flutter_math.dart';
          import 'package:markdown/markdown.dart' as md;
          """
          widgets = {
              'plain-markdown': "MarkdownBody(data: '# Heading\\n\\n- Item', extensionSet: md.ExtensionSet.gitHubFlavored)",
              'selection-markdown': "SelectionArea(child: MarkdownBody(data: '# Heading\\n\\n- Item', extensionSet: md.ExtensionSet.gitHubFlavored))",
              'direct-math': "Math.tex(r'\\int_0^1 x^2 dx = \\frac{1}{3}')",
              'latex-markdown-adapter': "MarkdownBody(data: r'Inline $a^2+b^2=c^2$.', builders: <String, MarkdownElementBuilder>{'latex': LatexElementBuilder()}, extensionSet: md.ExtensionSet(<md.BlockSyntax>[LatexBlockSyntax()], <md.InlineSyntax>[LatexInlineSyntax()]))",
          }
          source = imports + f"""
          void main() {{
            testWidgets('{scenario}', (WidgetTester tester) async {{
              await tester.pumpWidget(MaterialApp(home: Scaffold(body: {widgets[scenario]})));
              await tester.pump();
              expect(tester.takeException(), isNull);
            }});
          }}
          """
          Path('test/tmp_phase3_render_probe_test.dart').write_text(source)
          PY
      - name: Run isolated rendering probe
        working-directory: mobile/sentiq_chat
        run: timeout 90s flutter test --reporter expanded --timeout 60s test/tmp_phase3_render_probe_test.dart
