name: Phase 6 APK packaging diagnostic

on:
  push:
    branches:
      - feature/flutter-android-app
    paths:
      - .github/workflows/phase6-apk-diagnostic.yml

permissions:
  contents: read

env:
  FLUTTER_VERSION: "3.44.8"
  JAVA_VERSION: "17"

jobs:
  diagnose:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: mobile/sentiq_chat
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Bootstrap Android and dependencies
        run: |
          ./tool/bootstrap_android.sh
          flutter pub get
      - name: Build debug APK with captured diagnostics
        id: build
        shell: bash
        run: |
          set +e
          flutter build apk --debug --dart-define=SENTIQ_ENV=development -v 2>&1 | tee "$RUNNER_TEMP/phase6-apk-build.log"
          status=${PIPESTATUS[0]}
          echo "exit_status=$status" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Capture Gradle diagnostics
        if: always()
        shell: bash
        run: |
          {
            echo "=== gradle.properties ==="
            cat android/gradle.properties || true
            echo
            echo "=== app build.gradle.kts ==="
            cat android/app/build.gradle.kts || true
            echo
            echo "=== main manifest ==="
            cat android/app/src/main/AndroidManifest.xml || true
            echo
            echo "=== resource files ==="
            find android/app/src/main/res -type f -maxdepth 3 -print | sort || true
          } > "$RUNNER_TEMP/phase6-android-config.txt"
      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: phase6-apk-diagnostic-${{ github.sha }}
          path: |
            ${{ runner.temp }}/phase6-apk-build.log
            ${{ runner.temp }}/phase6-android-config.txt
          if-no-files-found: error
          retention-days: 1
      - name: Preserve build result
        if: always()
        run: exit "${{ steps.build.outputs.exit_status }}"
