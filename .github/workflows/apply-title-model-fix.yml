name: Apply title model fix

on:
  push:
    branches:
      - fix/title-model-groq-oss-20b
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - master

permissions:
  contents: write

jobs:
  apply:
    if: ${{ github.event_name == 'pull_request' || !contains(github.event.head_commit.message, '[skip title-model-fix]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply title model and parser hardening
        shell: python
        run: |
          from pathlib import Path

          root = Path.cwd()

          prompt_path = root / "backend/ai/PromptBuilders.ts"
          prompt = prompt_path.read_text(encoding="utf-8")
          title_start = prompt.index("export function buildTitleGeneratePrompt")
          title_end = prompt.index("// ==============================\n// Fallback response", title_start)
          title_block = prompt[title_start:title_end]
          old_title_line = '    prefer: "groq",\n'
          new_title_line = old_title_line + '    model_override: "openai/gpt-oss-20b",\n'
          if 'model_override: "openai/gpt-oss-20b"' not in title_block:
              if title_block.count(old_title_line) != 1:
                  raise SystemExit("Could not locate the unique title-provider line")
              title_block = title_block.replace(old_title_line, new_title_line, 1)
              prompt = prompt[:title_start] + title_block + prompt[title_end:]
              prompt_path.write_text(prompt, encoding="utf-8")

          adapter_path = root / "llm_adapter.py"
          adapter = adapter_path.read_text(encoding="utf-8")
          old_adapter = 'GROQ_MODEL = os.getenv("GROQ_MODEL", "llama-3.3-70b-versatile")'
          new_adapter = 'GROQ_MODEL = os.getenv("GROQ_MODEL", "openai/gpt-oss-20b")'
          if old_adapter not in adapter and new_adapter not in adapter:
              raise SystemExit("Could not locate the Groq global model default")
          adapter = adapter.replace(old_adapter, new_adapter, 1)
          adapter_path.write_text(adapter, encoding="utf-8")

          env_path = root / ".env.example"
          env = env_path.read_text(encoding="utf-8")
          old_env = "GROQ_MODEL=llama-3.3-70b-versatile"
          new_env = "GROQ_MODEL=openai/gpt-oss-20b"
          if old_env not in env and new_env not in env:
              raise SystemExit("Could not locate the Groq model example value")
          env = env.replace(old_env, new_env, 1)
          env_path.write_text(env, encoding="utf-8")

          server_path = root / "backend/server.ts"
          server = server_path.read_text(encoding="utf-8")
          old_parser = '''  const match = trimmed.match(/"title"\\s*:\\s*"([^\\"]+)"/i);\n  if (match && match[1]) {\n    return normalizeTitleCandidate(match[1]);\n  }\n\n  return normalizeTitleCandidate(trimmed);\n}'''
          new_parser = '''  const match = trimmed.match(/"title"\\s*:\\s*"([^\\"]+)"/i);\n  if (match && match[1]) {\n    return normalizeTitleCandidate(match[1]);\n  }\n\n  // Provider scaffolding is never a valid conversation title. Return an\n  // empty candidate so generateTitleWithFallback uses the deterministic\n  // first-user-message fallback instead of persisting strings such as\n  // ```json or ```json {.\n  const normalized = normalizeTitleCandidate(trimmed);\n  if (!normalized || /^```/i.test(normalized) || /^[\\[{]/.test(normalized)) {\n    return "";\n  }\n  return normalized;\n}'''
          if old_parser not in server:
              if new_parser not in server:
                  raise SystemExit("Could not locate the existing title parser fallback")
          else:
              server = server.replace(old_parser, new_parser, 1)
              server_path.write_text(server, encoding="utf-8")

      - name: Validate focused title regression contract
        run: node backend/testConversationTitleModelRouting.mjs

      - name: Validate TypeScript build
        run: |
          npm ci
          npm run build

      - name: Validate diff
        run: git diff --check

      - name: Commit implementation
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/apply-title-model-fix.yml
          git add backend/ai/PromptBuilders.ts backend/server.ts llm_adapter.py .env.example backend/testConversationTitleModelRouting.mjs .github/workflows/apply-title-model-fix.yml
          git commit -m "fix: pin Groq chat title model to gpt-oss-20b [skip title-model-fix]"
          git push origin HEAD:fix/title-model-groq-oss-20b
