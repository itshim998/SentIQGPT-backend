name: Apply and verify Phase 5

on:
  push:
    branches:
      - feature/flutter-android-app
    paths:
      - .github/workflows/phase5-apply.yml

permissions:
  contents: write

concurrency:
  group: phase5-apply-feature-flutter-android-app
  cancel-in-progress: false

env:
  FLUTTER_VERSION: "3.44.8"
  JAVA_VERSION: "17"
  PHASE5_BUNDLE_SHA256: "ffed905ef49b605d3759a8368aaf214cc7e4ee2d16c65996976699cb55b9e825"

jobs:
  apply-verify-commit:
    name: Apply, verify, and commit Phase 5
    runs-on: ubuntu-latest
    timeout-minutes: 55

    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v6
        with:
          ref: feature/flutter-android-app
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up pinned Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - name: Reconstruct and apply asserted Phase 5 bundle
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/phase5-parts.sha256 <<'EOF'
          4be7d8696b37137fecdb56de41e531a36e29ba4204780a3aeeb7fabe279bc231  tool/phase5-bundle.b64.part-00-00
          5c804933d6a1e5f7a5a915274a4f8ce6e22127f2ef762778bed9fcdc18cdfcd6  tool/phase5-bundle.b64.part-00-01
          b572527b6d2edec806c733c9dfbfed44e436fbd593269cdcb2f7ab10de228816  tool/phase5-bundle.b64.part-00-02
          f5f28d67a04758a9d4db18d705a7a1328495538cf30bd277bfcc97e6c598bd14  tool/phase5-bundle.b64.part-00-03
          728dc98553a587cbe14f61f05e680e140f7710eb4b9da980dfdc8f79fcddcdc8  tool/phase5-bundle.b64.part-00-04
          9b0c2cbcfc7616b6ba904f350f8c97ac2fbc600c1c71d7fb7bb16645a4ada1bd  tool/phase5-bundle.b64.part-01
          bd8aa8622110b0dd5e0082a51f5754d06a7de0b20349c8ff770cdf8d6df8b28f  tool/phase5-bundle.b64.part-02
          a7a721c022a038d0fd2cd924fa4d4e16be2697c4e63f73794c4c06d57a0f96d6  tool/phase5-bundle.b64.part-03
          f81b7a866eea8a036ad2d2e9bdb330b4240a5bcbdb7834b84ebbeef951ad5604  tool/phase5-bundle.b64.part-04
          c4f1a8e5413e2f48e850d7fd8491ccde2dcabace044e1c67c126abe9a8f5d661  tool/phase5-bundle.b64.part-05
          EOF
          sha256sum --check --strict /tmp/phase5-parts.sha256
          cat tool/phase5-bundle.b64.part-* > /tmp/phase5-bundle.b64
          base64 --decode /tmp/phase5-bundle.b64 > /tmp/phase5-bundle.tar.gz
          echo "${PHASE5_BUNDLE_SHA256}  /tmp/phase5-bundle.tar.gz" | sha256sum --check --strict
          tar -xzf /tmp/phase5-bundle.tar.gz -C .
          rm -f tool/phase5-bundle.b64.part-*
          rm -f .github/workflows/phase5-apply.yml
          test "$(cat mobile/sentiq_chat/.flutter-version)" = "${FLUTTER_VERSION}"
          grep -q 'mobileContractVersion = 4' mobile/sentiq_chat/lib/core/config/app_config.dart
          grep -q 'CURRENT_MOBILE_CONTRACT_VERSION = 4' backend/mobile/mobileContract.ts

      - name: Install SQLite test runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y libsqlite3-0

      - name: Generate Android scaffold without replacing native bridges
        working-directory: mobile/sentiq_chat
        run: ./tool/bootstrap_android.sh

      - name: Resolve Flutter dependencies
        working-directory: mobile/sentiq_chat
        run: flutter pub get

      - name: Format Dart sources
        working-directory: mobile/sentiq_chat
        run: dart format lib test

      - name: Static analysis
        working-directory: mobile/sentiq_chat
        run: flutter analyze

      - name: Unit and widget tests
        working-directory: mobile/sentiq_chat
        run: flutter test --coverage test/core test/features test/widgets

      - name: Navigation and adaptive integration tests
        working-directory: mobile/sentiq_chat
        run: flutter test test/integration

      - name: Contract fixture replay
        working-directory: mobile/sentiq_chat
        run: flutter test test/contracts/contract_fixture_replay_test.dart

      - name: Golden tests
        working-directory: mobile/sentiq_chat
        run: flutter test test/goldens

      - name: Build Android debug APK
        working-directory: mobile/sentiq_chat
        run: flutter build apk --debug --dart-define=SENTIQ_ENV=development

      - name: Install backend dependencies
        run: npm ci

      - name: Compile backend
        run: npm run build

      - name: Verify mobile contract v4
        run: npx ts-node --project tsconfig.backend.json backend/testMobileContract.ts

      - name: Verify Deep Research regressions
        run: npm run test:deep-research

      - name: Verify SentIQ Live regressions
        run: npm run test:live

      - name: Verify billing and Razorpay fixtures
        run: npm run billing:test-quota

      - name: Ensure temporary machinery is absent
        shell: bash
        run: |
          set -euo pipefail
          test ! -e .github/workflows/phase5-apply.yml
          ! compgen -G 'tool/phase5-bundle.b64.part-*' >/dev/null
          test ! -e .github/workflows/phase5-source-snapshot.yml
          grep -q 'android.permission.RECORD_AUDIO' mobile/sentiq_chat/android/app/src/main/AndroidManifest.xml
          grep -q 'com.sentiqlabs.sentiqchat/live_audio' mobile/sentiq_chat/android/app/src/main/kotlin/com/sentiqlabs/sentiq_chat/MainActivity.kt

      - name: Upload verified Android debug APK
        uses: actions/upload-artifact@v7
        with:
          name: sentiq-chat-phase5-debug-${{ github.sha }}
          path: mobile/sentiq_chat/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 7

      - name: Upload Phase 5 coverage
        uses: actions/upload-artifact@v7
        with:
          name: sentiq-chat-phase5-coverage-${{ github.run_id }}
          path: mobile/sentiq_chat/coverage/lcov.info
          if-no-files-found: error
          retention-days: 7

      - name: Commit verified Phase 5 implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && { echo 'No Phase 5 changes to commit'; exit 1; }
          git commit -m "Add Phase 5 research, Live, billing, and account completeness"
          git push origin HEAD:feature/flutter-android-app
