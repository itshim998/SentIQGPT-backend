name: Frontend idle trace

on:
  pull_request:
    paths:
      - "scripts/traceFrontendIdleChurn.mjs"
      - "scripts/inspectComposerHintSource.mjs"
      - ".github/workflows/frontend-idle-trace.yml"
  push:
    branches:
      - "ui/**"
    paths:
      - "scripts/traceFrontendIdleChurn.mjs"
      - "scripts/inspectComposerHintSource.mjs"
      - ".github/workflows/frontend-idle-trace.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frontend-idle-trace-${{ github.ref }}
  cancel-in-progress: true

jobs:
  trace:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm install --no-save --package-lock=false --ignore-scripts puppeteer-core@24.16.0
      - name: Trace idle frames and mutations
        run: node scripts/traceFrontendIdleChurn.mjs > frontend-idle-trace.log
      - name: Inspect composer hint source
        run: node scripts/inspectComposerHintSource.mjs > composer-hint-source.log
      - name: Upload idle trace
        uses: actions/upload-artifact@v4
        with:
          name: frontend-idle-trace-${{ github.run_id }}
          path: |
            frontend-idle-trace.log
            composer-hint-source.log
          if-no-files-found: error
          retention-days: 2
