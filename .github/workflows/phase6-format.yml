name: Phase 6 canonical Dart format

on:
  push:
    branches: [feature/flutter-android-app]
    paths: [.github/workflows/phase6-format.yml]
  workflow_dispatch:

permissions:
  contents: write

env:
  FLUTTER_VERSION: "3.44.8"

jobs:
  format:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Apply canonical formatter
        run: dart format mobile/sentiq_chat/lib/features/auth/presentation/launch_screen.dart
      - name: Commit formatter output
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add mobile/sentiq_chat/lib/features/auth/presentation/launch_screen.dart
          if git diff --cached --quiet; then
            echo 'File already canonically formatted.'
            exit 0
          fi
          git diff --cached --check
          git commit -m 'Apply canonical Dart format to launch screen'
          git push origin HEAD:feature/flutter-android-app
