name: Nemotron Intuitive full production rollout

on:
  push:
    branches:
      - master
  workflow_dispatch:
    inputs:
      confirmation:
        description: Confirm the complete production rollout and automatic rollback policy
        required: true
        type: choice
        options:
          - FULL_ROLLOUT

permissions:
  contents: read
  id-token: write

concurrency:
  group: azure-container-apps-production
  cancel-in-progress: false

env:
  IMAGE_REPOSITORY: sentiqgpt-backend

jobs:
  full-rollout:
    name: Verify, deploy, exercise, and automatically roll back on failure
    runs-on: ubuntu-latest
    timeout-minutes: 60
    if: >-
      (github.event_name == 'push' && contains(github.event.head_commit.message, '[nemotron-full-rollout]')) ||
      (github.event_name == 'workflow_dispatch' && inputs.confirmation == 'FULL_ROLLOUT')

    steps:
      - name: Checkout rollout commit
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Initialize redacted rollout evidence
        shell: bash
        run: |
          set -Eeuo pipefail
          export ROLLOUT_TEMP_ROOT="${RUNNER_TEMP}/sentiq-nemotron-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          printf 'ROLLOUT_TEMP_ROOT=%s\n' "${ROLLOUT_TEMP_ROOT}" >> "${GITHUB_ENV}"
          install -d -m 700 "${ROLLOUT_TEMP_ROOT}"
          printf '%s\n' \
            '{"event":"nemotron_full_rollout","status":"started","phase":"initialization"}' \
            > nemotron-rollout-summary.json

      - name: Install verification dependencies
        run: |
          npm ci
          python -m pip install --disable-pip-version-check requests python-dotenv

      - name: Run release-gate contracts
        run: |
          npm run build
          npm run test:nemotron-rollout-flags
          npm run test:nemotron-deployment-readiness
          npm run test:nemotron-production-readiness
          npm run test:nemotron-provider
          npm run billing:test-unified-text-v2
          npm run billing:test-unified-text-v2-sql
          npm run test:unified-text-routing
          npm run test:quota-ui-contract
          npm run test:protected-context-safety
          npm run test:request-budget-lifecycle
          npm run test:stream-lifecycle
          npm run test:nemotron-azure-rollout
          python -m py_compile backend/verifyNvidiaNemotronLive.py
          python -m py_compile backend/verifyPollinationsIntuitiveLive.py

      - name: Azure login
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Install verified Container Apps CLI extension
        shell: bash
        run: |
          set -Eeuo pipefail
          az extension add \
            --name containerapp \
            --version 1.3.0b4 \
            --upgrade \
            --only-show-errors \
            --output none
          extension_version="$(az extension show --name containerapp --query version -o tsv)"
          [[ "${extension_version}" == "1.3.0b4" ]] || {
            echo 'Unexpected Azure Container Apps CLI extension version.'
            exit 1
          }
          echo "Container Apps CLI extension ${extension_version} verified."

      - name: Capture and prove the last-known-good production state
        id: production
        shell: bash
        env:
          APP_NAME: ${{ vars.AZURE_CONTAINER_APP_NAME }}
          RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
          GH_NVIDIA_API_KEY_1: ${{ secrets.NVIDIA_API_KEY_1 }}
          GH_NVIDIA_API_KEY_2: ${{ secrets.NVIDIA_API_KEY_2 }}
          GH_NVIDIA_API_KEY_3: ${{ secrets.NVIDIA_API_KEY_3 }}
          GH_NVIDIA_API_KEY_4: ${{ secrets.NVIDIA_API_KEY_4 }}
          GH_NVIDIA_API_KEY_5: ${{ secrets.NVIDIA_API_KEY_5 }}
          GH_NVIDIA_API_KEY_6: ${{ secrets.NVIDIA_API_KEY_6 }}
          GH_SENTIQ_ANON_USAGE_HASH_SECRET: ${{ secrets.SENTIQ_ANON_USAGE_HASH_SECRET }}
        run: |
          set -Eeuo pipefail
          umask 077
          [[ -n "${APP_NAME}" && -n "${RESOURCE_GROUP}" ]] || {
            echo 'Azure production app variables are required.'
            exit 1
          }

          app_json="${ROLLOUT_TEMP_ROOT}/app.json"
          revision_json="${ROLLOUT_TEMP_ROOT}/rollback-revision.json"
          replicas_json="${ROLLOUT_TEMP_ROOT}/rollback-replicas.json"
          environment_json="${ROLLOUT_TEMP_ROOT}/rollback-environment.json"
          secret_names_json="${ROLLOUT_TEMP_ROOT}/azure-secret-names.json"
          secret_resolution_json="${ROLLOUT_TEMP_ROOT}/secret-resolution.json"
          runtime_exec_log="${ROLLOUT_TEMP_ROOT}/runtime-exec.log"
          runtime_report_json="${ROLLOUT_TEMP_ROOT}/runtime-report.json"
          inspection_json="${ROLLOUT_TEMP_ROOT}/inspection.json"

          az containerapp show \
            --name "${APP_NAME}" \
            --resource-group "${RESOURCE_GROUP}" \
            -o json > "${app_json}"
          latest_ready_revision="$(jq -r '.properties.latestReadyRevisionName // empty' "${app_json}")"
          latest_revision="$(jq -r '.properties.latestRevisionName // empty' "${app_json}")"
          fqdn="$(jq -r '.properties.configuration.ingress.fqdn // empty' "${app_json}")"
          previous_mode="$(jq -r '.properties.configuration.activeRevisionsMode // empty' "${app_json}")"
          [[ -n "${latest_ready_revision}" && -n "${fqdn}" ]] || {
            echo 'Azure did not return a last-ready production revision and FQDN.'
            exit 1
          }

          ready_status=0
          for attempt in $(seq 1 90); do
            ready_status="$(curl \
              --silent \
              --output /dev/null \
              --write-out '%{http_code}' \
              --max-time 15 \
              "https://${fqdn}/ready" || true)"
            [[ "${ready_status}" == "200" ]] && break
            sleep 2
          done
          [[ "${ready_status}" == "200" ]] || {
            echo 'The last-ready production endpoint did not pass /ready.'
            exit 1
          }

          az containerapp revision show \
            --name "${APP_NAME}" \
            --resource-group "${RESOURCE_GROUP}" \
            --revision "${latest_ready_revision}" \
            -o json > "${revision_json}"
          az containerapp replica list \
            --name "${APP_NAME}" \
            --resource-group "${RESOURCE_GROUP}" \
            --revision "${latest_ready_revision}" \
            --query '[].{name:name}' \
            -o json > "${replicas_json}"
          jq --arg container "${IMAGE_REPOSITORY}" \
            '[.properties.template.containers[] | select(.name == $container) | .env[]?]' \
            "${revision_json}" > "${environment_json}"
          az containerapp secret list \
            --name "${APP_NAME}" \
            --resource-group "${RESOURCE_GROUP}" \
            --query '[].name' \
            -o json > "${secret_names_json}"

          github_secrets_present=()
          for secret_name in \
            NVIDIA_API_KEY_1 \
            NVIDIA_API_KEY_2 \
            NVIDIA_API_KEY_3 \
            NVIDIA_API_KEY_4 \
            NVIDIA_API_KEY_5 \
            NVIDIA_API_KEY_6 \
            SENTIQ_ANON_USAGE_HASH_SECRET; do
            github_variable="GH_${secret_name}"
            if [[ -n "${!github_variable:-}" ]]; then
              github_secrets_present+=("${secret_name}")
            fi
          done
          github_secret_csv="$(IFS=,; echo "${github_secrets_present[*]}")"
          node scripts/resolveAzureSecretReferences.mjs \
            --environment "${environment_json}" \
            --secret-names "${secret_names_json}" \
            --github-secrets-present "${github_secret_csv}" \
            --output "${secret_resolution_json}"

          rollback_replica="$(jq -r '.[0].name // empty' "${replicas_json}")"
          [[ -n "${rollback_replica}" ]] || {
            echo 'The last-ready revision has no running replica.'
            exit 1
          }
          runtime_command="$(node scripts/verifyAzureRuntimeEnvironment.mjs --emit-command --allow-missing=SENTIQ_POLLINATIONS_TOOL_TRANSPORT_ENABLED_PRESENT)"
          bash scripts/execAzureContainerAppCommand.sh \
            --name "${APP_NAME}" \
            --resource-group "${RESOURCE_GROUP}" \
            --revision "${latest_ready_revision}" \
            --replica "${rollback_replica}" \
            --container "${IMAGE_REPOSITORY}" \
            --command "${runtime_command}" | tee "${runtime_exec_log}"
          grep -a '"event": "azure_runtime_environment"' "${runtime_exec_log}" \
            | tail -1 \
            | tr -d '\r' > "${runtime_report_json}"
          jq -e '.event == "azure_runtime_environment" and .ok == true' \
            "${runtime_report_json}" >/dev/null

          node scripts/inspectAzureContainerAppState.mjs \
            --app "${app_json}" \
            --revision "${revision_json}" \
            --replicas "${replicas_json}" \
            --secret-resolution "${secret_resolution_json}" \
            --runtime-report "${runtime_report_json}" \
            --ready-http-status "${ready_status}" \
            --container-name "${IMAGE_REPOSITORY}" \
            --output "${inspection_json}"

          previous_image="$(jq -r '.rollbackSource.image' "${inspection_json}")"
          echo "latest_revision=${latest_revision}" >> "${GITHUB_OUTPUT}"
          echo "previous_revision=${latest_ready_revision}" >> "${GITHUB_OUTPUT}"
          echo "previous_image=${previous_image}" >> "${GITHUB_OUTPUT}"
          echo "previous_mode=${previous_mode}" >> "${GITHUB_OUTPUT}"
          echo "fqdn=${fqdn}" >> "${GITHUB_OUTPUT}"
          echo "secret_resolution=${secret_resolution_json}" >> "${GITHUB_OUTPUT}"
          echo "Last-known-good production revision ${latest_ready_revision} passed structural, replica, runtime, and /ready checks."

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Azure Container Registry
        run: az acr login --name '${{ vars.AZURE_ACR_NAME }}'

      - name: Build and push immutable rollout image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ vars.AZURE_ACR_LOGIN_SERVER }}/${{ env.IMAGE_REPOSITORY }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify production image packaging
        shell: bash
        env:
          DEPLOY_IMAGE: ${{ vars.AZURE_ACR_LOGIN_SERVER }}/${{ env.IMAGE_REPOSITORY }}:${{ github.sha }}
        run: |
          set -Eeuo pipefail
          docker pull "${DEPLOY_IMAGE}"
          docker run --rm --entrypoint python "${DEPLOY_IMAGE}" \
            -c "import llm_adapter; from backend.nvidia_nemotron import NvidiaNemotronProvider; print('nemotron-runtime-import-ok')"
          docker run --rm --entrypoint node "${DEPLOY_IMAGE}" \
            dist/backend/verifyNemotronDeploymentReadiness.js

      - name: Create only missing rollout secrets after preflight
        id: secrets
        shell: bash
        env:
          APP_NAME: ${{ vars.AZURE_CONTAINER_APP_NAME }}
          RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
          SECRET_RESOLUTION: ${{ steps.production.outputs.secret_resolution }}
          GH_NVIDIA_API_KEY_1: ${{ secrets.NVIDIA_API_KEY_1 }}
          GH_NVIDIA_API_KEY_2: ${{ secrets.NVIDIA_API_KEY_2 }}
          GH_NVIDIA_API_KEY_3: ${{ secrets.NVIDIA_API_KEY_3 }}
          GH_NVIDIA_API_KEY_4: ${{ secrets.NVIDIA_API_KEY_4 }}
          GH_NVIDIA_API_KEY_5: ${{ secrets.NVIDIA_API_KEY_5 }}
          GH_NVIDIA_API_KEY_6: ${{ secrets.NVIDIA_API_KEY_6 }}
          GH_SENTIQ_ANON_USAGE_HASH_SECRET: ${{ secrets.SENTIQ_ANON_USAGE_HASH_SECRET }}
        run: |
          set -Eeuo pipefail
          umask 077
          before_latest="$(az containerapp show \
            --name "${APP_NAME}" \
            --resource-group "${RESOURCE_GROUP}" \
            --query 'properties.latestRevisionName' \
            -o tsv)"
          before_ready="$(az containerapp show \
            --name "${APP_NAME}" \
            --resource-group "${RESOURCE_GROUP}" \
            --query 'properties.latestReadyRevisionName' \
            -o tsv)"

          secrets_to_set=()
          while IFS=$'\t' read -r environment_name secret_name; do
            [[ -n "${environment_name}" && -n "${secret_name}" ]] || continue
            github_variable="GH_${environment_name}"
            github_value="${!github_variable:-}"
            [[ -n "${github_value}" ]] || {
              echo "Required GitHub Actions secret ${environment_name} is unavailable."
              exit 1
            }
            secrets_to_set+=("${secret_name}=${github_value}")
          done < <(jq -r '.create[] | [.environmentName, .secretName] | @tsv' "${SECRET_RESOLUTION}")

          if (( ${#secrets_to_set[@]} > 0 )); then
            az containerapp secret set \
              --name "${APP_NAME}" \
              --resource-group "${RESOURCE_GROUP}" \
              --secrets "${secrets_to_set[@]}" \
              --only-show-errors \
              --output none
          fi
          unset secrets_to_set github_value

          after_latest="$(az containerapp show \
            --name "${APP_NAME}" \
            --resource-group "${RESOURCE_GROUP}" \
            --query 'properties.latestRevisionName' \
            -o tsv)"
          after_ready="$(az containerapp show \
            --name "${APP_NAME}" \
            --resource-group "${RESOURCE_GROUP}" \
            --query 'properties.latestReadyRevisionName' \
            -o tsv)"
          [[ "${after_latest}" == "${before_latest}" && "${after_ready}" == "${before_ready}" ]] || {
            echo 'Secret creation unexpectedly changed the active application revision.'
            exit 1
          }

          az containerapp secret list \
            --name "${APP_NAME}" \
            --resource-group "${RESOURCE_GROUP}" \
            --query '[].name' \
            -o json > "${ROLLOUT_TEMP_ROOT}/secret-names-after-create.json"
          jq -e \
            --slurpfile names "${ROLLOUT_TEMP_ROOT}/secret-names-after-create.json" \
            '([.references[]] - $names[0]) | length == 0' \
            "${SECRET_RESOLUTION}" >/dev/null
          echo "created_count=$(jq '.create | length' "${SECRET_RESOLUTION}")" >> "${GITHUB_OUTPUT}"
          echo 'All rollout secret references resolve by name; no secret value was emitted.'

      - name: Blue-green deploy, verify, activate, and restore exactly on failure
        id: rollout
        shell: bash
        env:
          APP_NAME: ${{ vars.AZURE_CONTAINER_APP_NAME }}
          RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
          FQDN: ${{ steps.production.outputs.fqdn }}
          PREVIOUS_REVISION: ${{ steps.production.outputs.previous_revision }}
          PREVIOUS_IMAGE: ${{ steps.production.outputs.previous_image }}
          SECRET_RESOLUTION: ${{ steps.production.outputs.secret_resolution }}
          DEPLOY_IMAGE: ${{ vars.AZURE_ACR_LOGIN_SERVER }}/${{ env.IMAGE_REPOSITORY }}:${{ github.sha }}
        run: |
          set -Eeuo pipefail
          umask 077
          verified=0
          mode_changed=0
          traffic_shifted=0
          revision_suffix="full-${GITHUB_SHA::10}-${GITHUB_RUN_ID}"
          new_revision="${APP_NAME}--${revision_suffix}"
          rollback_suffix="rollback-${GITHUB_SHA::10}-${GITHUB_RUN_ID}"
          rollback_revision="${APP_NAME}--${rollback_suffix}"
          azure_report="azure-full-rollout-report.jsonl"

          write_summary() {
            local status="$1"
            local phase="$2"
            jq -n \
              --arg status "${status}" \
              --arg phase "${phase}" \
              --arg commit "${GITHUB_SHA}" \
              --arg previous_revision "${PREVIOUS_REVISION}" \
              --arg new_revision "${new_revision}" \
              --arg rollback_revision "${rollback_revision}" \
              --arg image "${DEPLOY_IMAGE}" \
              '{
                event: "nemotron_full_rollout",
                status: $status,
                phase: $phase,
                commit: $commit,
                previous_revision: $previous_revision,
                new_revision: $new_revision,
                rollback_revision: $rollback_revision,
                image: $image
              }' > nemotron-rollout-summary.json
          }

          restore_previous_release() {
            local status="$?"
            trap - EXIT
            if [[ "${status}" != "0" && "${verified}" != "1" ]]; then
              set +e
              if [[ "${mode_changed}" != "1" ]]; then
                write_summary failure no_revision_mutation
                echo 'No Azure revision mutation occurred; rollback was not required.'
                exit "${status}"
              fi

              write_summary failure automatic_rollback
              echo 'Full rollout verification failed; restoring exact last-known-good traffic and revision.'
              rollback_ok=1

              if [[ "${mode_changed}" == "1" ]]; then
                az containerapp revision set-mode \
                  --name "${APP_NAME}" \
                  --resource-group "${RESOURCE_GROUP}" \
                  --mode multiple \
                  --only-show-errors \
                  --output none || rollback_ok=0

                new_exists="$(az containerapp revision show \
                  --name "${APP_NAME}" \
                  --resource-group "${RESOURCE_GROUP}" \
                  --revision "${new_revision}" \
                  --query 'name' \
                  -o tsv 2>/dev/null || true)"

                rollback_exists="$(az containerapp revision show \
                  --name "${APP_NAME}" \
                  --resource-group "${RESOURCE_GROUP}" \
                  --revision "${rollback_revision}" \
                  --query 'name' \
                  -o tsv 2>/dev/null || true)"
                if [[ "${rollback_exists}" != "${rollback_revision}" ]]; then
                  az containerapp revision copy \
                    --name "${APP_NAME}" \
                    --resource-group "${RESOURCE_GROUP}" \
                    --from-revision "${PREVIOUS_REVISION}" \
                    --revision-suffix "${rollback_suffix}" \
                    --only-show-errors \
                    --output none || rollback_ok=0
                fi

                rollback_copy_ready=0
                if [[ "${rollback_ok}" == "1" ]]; then
                  for attempt in $(seq 1 90); do
                    rollback_state="$(az containerapp revision show \
                      --name "${APP_NAME}" \
                      --resource-group "${RESOURCE_GROUP}" \
                      --revision "${rollback_revision}" \
                      -o json 2>/dev/null || printf '{}')"
                    rollback_health="$(jq -r '.properties.healthState // empty' <<< "${rollback_state}")"
                    rollback_provisioning="$(jq -r '.properties.provisioningState // empty' <<< "${rollback_state}")"
                    rollback_running="$(jq -r '.properties.runningState // empty' <<< "${rollback_state}")"
                    rollback_image="$(jq -r --arg container "${IMAGE_REPOSITORY}" \
                      '.properties.template.containers[]?
                        | select(.name == $container)
                        | .image // empty' <<< "${rollback_state}")"
                    rollback_fqdn="$(jq -r '.properties.fqdn // empty' <<< "${rollback_state}")"
                    rollback_ready_status="$(curl \
                      --silent \
                      --output /dev/null \
                      --write-out '%{http_code}' \
                      --max-time 15 \
                      "https://${rollback_fqdn}/ready" || true)"
                    if [[ "${rollback_health}" == "Healthy" \
                      && "${rollback_provisioning}" == "Provisioned" \
                      && "${rollback_running}" == Running* \
                      && "${rollback_image}" == "${PREVIOUS_IMAGE}" \
                      && "${rollback_ready_status}" == "200" ]]; then
                      rollback_copy_ready=1
                      break
                    fi
                    sleep 2
                  done
                fi
                [[ "${rollback_copy_ready}" == "1" ]] || rollback_ok=0

                previous_active="$(az containerapp revision show \
                  --name "${APP_NAME}" \
                  --resource-group "${RESOURCE_GROUP}" \
                  --revision "${PREVIOUS_REVISION}" \
                  --query 'properties.active' \
                  -o tsv 2>/dev/null || true)"
                if [[ "${previous_active,,}" != "true" ]]; then
                  az containerapp revision activate \
                    --name "${APP_NAME}" \
                    --resource-group "${RESOURCE_GROUP}" \
                    --revision "${PREVIOUS_REVISION}" \
                    --only-show-errors \
                    --output none || rollback_ok=0
                fi

                if [[ "${rollback_copy_ready}" == "1" && "${new_exists}" == "${new_revision}" ]]; then
                  az containerapp ingress traffic set \
                    --name "${APP_NAME}" \
                    --resource-group "${RESOURCE_GROUP}" \
                    --revision-weight \
                      "${PREVIOUS_REVISION}=0" \
                      "${rollback_revision}=100" \
                      "${new_revision}=0" \
                    --only-show-errors \
                    --output none || rollback_ok=0
                elif [[ "${rollback_copy_ready}" == "1" ]]; then
                  az containerapp ingress traffic set \
                    --name "${APP_NAME}" \
                    --resource-group "${RESOURCE_GROUP}" \
                    --revision-weight \
                      "${PREVIOUS_REVISION}=0" \
                      "${rollback_revision}=100" \
                    --only-show-errors \
                    --output none || rollback_ok=0
                elif [[ "${new_exists}" == "${new_revision}" ]]; then
                  az containerapp ingress traffic set \
                    --name "${APP_NAME}" \
                    --resource-group "${RESOURCE_GROUP}" \
                    --revision-weight "${PREVIOUS_REVISION}=100" "${new_revision}=0" \
                    --only-show-errors \
                    --output none || rollback_ok=0
                else
                  az containerapp ingress traffic set \
                    --name "${APP_NAME}" \
                    --resource-group "${RESOURCE_GROUP}" \
                    --revision-weight "${PREVIOUS_REVISION}=100" \
                    --only-show-errors \
                    --output none || rollback_ok=0
                fi

                if [[ "${new_exists}" == "${new_revision}" ]]; then
                  new_active="$(az containerapp revision show \
                    --name "${APP_NAME}" \
                    --resource-group "${RESOURCE_GROUP}" \
                    --revision "${new_revision}" \
                    --query 'properties.active' \
                    -o tsv 2>/dev/null || true)"
                  if [[ "${new_active,,}" == "true" ]]; then
                    az containerapp revision deactivate \
                      --name "${APP_NAME}" \
                      --resource-group "${RESOURCE_GROUP}" \
                      --revision "${new_revision}" \
                      --only-show-errors \
                      --output none || rollback_ok=0
                  fi
                fi
              fi

              restored=0
              for attempt in $(seq 1 90); do
                app_state="$(az containerapp show \
                  --name "${APP_NAME}" \
                  --resource-group "${RESOURCE_GROUP}" \
                  -o json 2>/dev/null || printf '{}')"
                ready_revision="$(jq -r '.properties.latestReadyRevisionName // empty' <<< "${app_state}")"
                current_mode="$(jq -r '.properties.configuration.activeRevisionsMode // empty' <<< "${app_state}")"
                ready_status="$(curl \
                  --silent \
                  --output /dev/null \
                  --write-out '%{http_code}' \
                  --max-time 15 \
                  "https://${FQDN}/ready" || true)"
                rollback_state="$(az containerapp revision show \
                  --name "${APP_NAME}" \
                  --resource-group "${RESOURCE_GROUP}" \
                  --revision "${rollback_revision}" \
                  -o json 2>/dev/null || printf '{}')"
                rollback_health="$(jq -r '.properties.healthState // empty' <<< "${rollback_state}")"
                rollback_active="$(jq -r '.properties.active // false' <<< "${rollback_state}")"
                rollback_weight="$(jq -r '.properties.trafficWeight // empty' <<< "${rollback_state}")"
                source_state="$(az containerapp revision show \
                  --name "${APP_NAME}" \
                  --resource-group "${RESOURCE_GROUP}" \
                  --revision "${PREVIOUS_REVISION}" \
                  -o json 2>/dev/null || printf '{}')"
                source_health="$(jq -r '.properties.healthState // empty' <<< "${source_state}")"
                source_active="$(jq -r '.properties.active // false' <<< "${source_state}")"
                source_image="$(jq -r --arg container "${IMAGE_REPOSITORY}" \
                  '.properties.template.containers[]?
                    | select(.name == $container)
                    | .image // empty' <<< "${source_state}")"
                if [[ "${ready_revision}" == "${rollback_revision}" \
                  && "${ready_status}" == "200" \
                  && "${rollback_health}" == "Healthy" \
                  && "${rollback_active,,}" == "true" \
                  && "${rollback_weight}" == "100" \
                  && "${current_mode,,}" == "multiple" \
                  && "${source_health}" == "Healthy" \
                  && "${source_active,,}" == "true" \
                  && "${source_image}" == "${PREVIOUS_IMAGE}" ]]; then
                  restored=1
                  break
                fi
                sleep 2
              done
              [[ "${restored}" == "1" ]] || rollback_ok=0

              failed_weight="$(az containerapp revision show \
                --name "${APP_NAME}" \
                --resource-group "${RESOURCE_GROUP}" \
                --revision "${new_revision}" \
                --query 'properties.trafficWeight' \
                -o tsv 2>/dev/null || true)"
              failed_active="$(az containerapp revision show \
                --name "${APP_NAME}" \
                --resource-group "${RESOURCE_GROUP}" \
                --revision "${new_revision}" \
                --query 'properties.active' \
                -o tsv 2>/dev/null || true)"
              [[ -z "${failed_weight}" || "${failed_weight}" == "0" || "${failed_weight}" == "None" ]] \
                || rollback_ok=0
              [[ -z "${failed_active}" || "${failed_active}" == "false" || "${failed_active}" == "None" ]] \
                || rollback_ok=0

              if [[ "${rollback_ok}" != "1" ]]; then
                echo 'CRITICAL: exact production rollback verification failed.'
                exit 86
              fi
              echo "Exact production rollback copy ${rollback_revision} verified from ${PREVIOUS_REVISION}; failed revision has no traffic."
            fi
            exit "${status}"
          }
          trap restore_previous_release EXIT

          ref() {
            jq -r --arg name "$1" '.references[$name] // empty' "${SECRET_RESOLUTION}"
          }
          nvidia_ref_1="$(ref NVIDIA_API_KEY_1)"
          nvidia_ref_2="$(ref NVIDIA_API_KEY_2)"
          nvidia_ref_3="$(ref NVIDIA_API_KEY_3)"
          nvidia_ref_4="$(ref NVIDIA_API_KEY_4)"
          nvidia_ref_5="$(ref NVIDIA_API_KEY_5)"
          nvidia_ref_6="$(ref NVIDIA_API_KEY_6)"
          pollinations_ref="$(ref POLLINATIONS_API_KEY)"
          anon_ref="$(ref SENTIQ_ANON_USAGE_HASH_SECRET)"
          supabase_url_ref="$(ref SUPABASE_URL_1)"
          supabase_role_ref="$(ref SUPABASE_SERVICE_ROLE_KEY_1)"
          for reference in \
            "${nvidia_ref_1}" \
            "${nvidia_ref_2}" \
            "${nvidia_ref_3}" \
            "${nvidia_ref_4}" \
            "${nvidia_ref_5}" \
            "${nvidia_ref_6}" \
            "${pollinations_ref}" \
            "${anon_ref}" \
            "${supabase_url_ref}" \
            "${supabase_role_ref}"; do
            [[ -n "${reference}" ]] || {
              echo 'A required rollout secret reference is missing.'
              exit 1
            }
          done

          az containerapp revision set-mode \
            --name "${APP_NAME}" \
            --resource-group "${RESOURCE_GROUP}" \
            --mode multiple \
            --only-show-errors \
            --output none
          mode_changed=1
          az containerapp ingress traffic set \
            --name "${APP_NAME}" \
            --resource-group "${RESOURCE_GROUP}" \
            --revision-weight "${PREVIOUS_REVISION}=100" \
            --only-show-errors \
            --output none

          az containerapp revision copy \
            --name "${APP_NAME}" \
            --resource-group "${RESOURCE_GROUP}" \
            --from-revision "${PREVIOUS_REVISION}" \
            --container-name "${IMAGE_REPOSITORY}" \
            --image "${DEPLOY_IMAGE}" \
            --revision-suffix "${revision_suffix}" \
            --set-env-vars \
              "NVIDIA_API_KEY_1=secretref:${nvidia_ref_1}" \
              "NVIDIA_API_KEY_2=secretref:${nvidia_ref_2}" \
              "NVIDIA_API_KEY_3=secretref:${nvidia_ref_3}" \
              "NVIDIA_API_KEY_4=secretref:${nvidia_ref_4}" \
              "NVIDIA_API_KEY_5=secretref:${nvidia_ref_5}" \
              "NVIDIA_API_KEY_6=secretref:${nvidia_ref_6}" \
              "POLLINATIONS_API_KEY=secretref:${pollinations_ref}" \
              "SENTIQ_ANON_USAGE_HASH_SECRET=secretref:${anon_ref}" \
              "SUPABASE_URL_1=secretref:${supabase_url_ref}" \
              "SUPABASE_SERVICE_ROLE_KEY_1=secretref:${supabase_role_ref}" \
              "SENTIQ_NEMOTRON_ROLLOUT_STAGE=full" \
              "SENTIQ_NEMOTRON_FULL_ROLLOUT_ACK=ENABLE_FULL_NEMOTRON_ROLLOUT" \
              "SENTIQ_NEMOTRON_CANARY_DEPLOYMENT_ID=" \
              "SENTIQ_NVIDIA_PROVIDER_ENABLED=true" \
              "SENTIQ_NEMOTRON_INTUITIVE_ENABLED=true" \
              "SENTIQ_UNIFIED_TEXT_TOKENS_V2_ENABLED=true" \
              "SENTIQ_INTUITIVE_QUOTA_UI_ENABLED=true" \
              "SENTIQ_MODEL_TOOL_REGISTRY_ENABLED=true" \
              "SENTIQ_GROQ_TOOL_TRANSPORT_ENABLED=true" \
              "SENTIQ_GEMINI_TOOL_TRANSPORT_ENABLED=true" \
              "SENTIQ_POLLINATIONS_TOOL_TRANSPORT_ENABLED=true" \
              "SENTIQ_MODEL_IMAGE_SELECTION_ENABLED=true" \
              "SENTIQ_MODEL_WEBSURF_SELECTION_ENABLED=false" \
              "SENTIQ_MODEL_CHART_SELECTION_ENABLED=false" \
              "SENTIQ_MODEL_FILE_SELECTION_ENABLED=false" \
              "SENTIQ_MODEL_MEMORY_SELECTION_ENABLED=false" \
              "SENTIQ_MODEL_TOOL_DIAGNOSTICS_ENABLED=false" \
              "NVIDIA_BASE_URL=https://integrate.api.nvidia.com/v1" \
              "NVIDIA_NEMOTRON_MODEL=nvidia/nemotron-3-ultra-550b-a55b" \
              "POLLINATIONS_OPENAI_ENDPOINT=https://gen.pollinations.ai/v1/chat/completions" \
              "POLLINATIONS_INTUITIVE_MODEL=deepseek" \
              "SENTIQ_NVIDIA_MAX_GENERATED_TOKENS=8000" \
              "SENTIQ_INTUITIVE_TOTAL_TIMEOUT_MS=120000" \
              "SENTIQ_NVIDIA_FIRST_CHUNK_TIMEOUT_MS=30000" \
              "SENTIQ_NVIDIA_STREAM_IDLE_TIMEOUT_MS=45000" \
              "SENTIQ_NVIDIA_KEY_COOLDOWN_MS=60000" \
              "SENTIQ_NVIDIA_429_COOLDOWN_MS=180000" \
              "SENTIQ_NVIDIA_AUTH_FAILURE_COOLDOWN_MS=3600000" \
              "SENTIQ_PYTHON_LLM_QUOTA_ENFORCEMENT=false" \
              "SENTIQ_DEPLOYMENT_REVISION=${GITHUB_SHA}" \
            --only-show-errors \
            --output none

          latest_revision="$(az containerapp show \
            --name "${APP_NAME}" \
            --resource-group "${RESOURCE_GROUP}" \
            --query 'properties.latestRevisionName' \
            -o tsv)"
          [[ "${latest_revision}" == "${new_revision}" ]] || {
            echo 'Azure did not create the deterministic rollout revision.'
            exit 1
          }
          initial_new_weight="$(az containerapp revision list \
            --name "${APP_NAME}" \
            --resource-group "${RESOURCE_GROUP}" \
            --query "[?name=='${new_revision}'].properties.trafficWeight | [0]" \
            -o tsv)"
          [[ -z "${initial_new_weight}" || "${initial_new_weight}" == "0" || "${initial_new_weight}" == "None" ]] || {
            echo 'The unverified rollout revision received production traffic.'
            exit 1
          }

          revision_json="${ROLLOUT_TEMP_ROOT}/new-revision.json"
          revision_ready=0
          new_fqdn=''
          for attempt in $(seq 1 120); do
            az containerapp revision show \
              --name "${APP_NAME}" \
              --resource-group "${RESOURCE_GROUP}" \
              --revision "${new_revision}" \
              -o json > "${revision_json}"
            provisioning="$(jq -r '.properties.provisioningState // empty' "${revision_json}")"
            health="$(jq -r '.properties.healthState // empty' "${revision_json}")"
            running="$(jq -r '.properties.runningState // empty' "${revision_json}")"
            new_fqdn="$(jq -r '.properties.fqdn // empty' "${revision_json}")"
            if [[ "${provisioning}" == "Failed" \
              || "${health}" == "Unhealthy" \
              || "${running}" == "Failed" \
              || "${running}" == "Degraded" ]]; then
              echo "New revision failed before traffic activation: provisioning=${provisioning} health=${health} running=${running}."
              exit 1
            fi
            if [[ "${provisioning}" == "Provisioned" \
              && "${health}" == "Healthy" \
              && ( "${running}" == "Running" \
                || "${running}" == "Processing" \
                || "${running}" == "RunningAtMaxScale" ) \
              && -n "${new_fqdn}" ]]; then
              revision_ready=1
              break
            fi
            sleep 3
          done
          [[ "${revision_ready}" == "1" ]] || {
            echo 'The rollout revision did not become healthy before activation.'
            exit 1
          }

          revision_ready_status="$(curl \
            --fail \
            --silent \
            --output /dev/null \
            --write-out '%{http_code}' \
            --max-time 30 \
            "https://${new_fqdn}/ready")"
          [[ "${revision_ready_status}" == "200" ]] || {
            echo 'The zero-traffic rollout revision failed /ready.'
            exit 1
          }

          deployed_image="$(jq -r --arg container "${IMAGE_REPOSITORY}" \
            '.properties.template.containers[] | select(.name == $container) | .image // empty' \
            "${revision_json}")"
          deployed_sha="$(jq -r --arg container "${IMAGE_REPOSITORY}" \
            '.properties.template.containers[] | select(.name == $container)
              | [.env[]? | select(.name == "SENTIQ_DEPLOYMENT_REVISION") | .value]
              | first // empty' \
            "${revision_json}")"
          [[ "${deployed_image}" == "${DEPLOY_IMAGE}" && "${deployed_sha}" == "${GITHUB_SHA}" ]] || {
            echo 'The rollout image or deployment revision does not match the immutable commit.'
            exit 1
          }
          for flag_name in \
            SENTIQ_NVIDIA_PROVIDER_ENABLED \
            SENTIQ_NEMOTRON_INTUITIVE_ENABLED \
            SENTIQ_UNIFIED_TEXT_TOKENS_V2_ENABLED \
            SENTIQ_INTUITIVE_QUOTA_UI_ENABLED; do
            flag_value="$(jq -r --arg container "${IMAGE_REPOSITORY}" --arg name "${flag_name}" \
              '.properties.template.containers[] | select(.name == $container)
                | [.env[]? | select(.name == $name) | .value]
                | first // empty' \
              "${revision_json}")"
            [[ "${flag_value}" == "true" ]] || {
              echo "${flag_name} is not active on the rollout revision."
              exit 1
            }
          done
          # Verify the image-only model-tool activation bundle before live probes.
          for flag_name in \
            SENTIQ_MODEL_TOOL_REGISTRY_ENABLED \
            SENTIQ_GROQ_TOOL_TRANSPORT_ENABLED \
            SENTIQ_GEMINI_TOOL_TRANSPORT_ENABLED \
            SENTIQ_POLLINATIONS_TOOL_TRANSPORT_ENABLED \
            SENTIQ_MODEL_IMAGE_SELECTION_ENABLED; do
            flag_value="$(jq -r --arg container "${IMAGE_REPOSITORY}" --arg name "${flag_name}" \
              '.properties.template.containers[] | select(.name == $container)
                | [.env[]? | select(.name == $name) | .value]
                | first // empty' \
              "${revision_json}")"
            [[ "${flag_value}" == "true" ]] || {
              echo "${flag_name} is not enabled on the rollout revision."
              exit 1
            }
          done

          for flag_name in \
            SENTIQ_MODEL_WEBSURF_SELECTION_ENABLED \
            SENTIQ_MODEL_CHART_SELECTION_ENABLED \
            SENTIQ_MODEL_FILE_SELECTION_ENABLED \
            SENTIQ_MODEL_MEMORY_SELECTION_ENABLED \
            SENTIQ_MODEL_TOOL_DIAGNOSTICS_ENABLED; do
            flag_value="$(jq -r --arg container "${IMAGE_REPOSITORY}" --arg name "${flag_name}" \
              '.properties.template.containers[] | select(.name == $container)
                | [.env[]? | select(.name == $name) | .value]
                | first // empty' \
              "${revision_json}")"
            [[ "${flag_value}" == "false" ]] || {
              echo "${flag_name} is not disabled on the rollout revision."
              exit 1
            }
          done

          replica=''
          for attempt in $(seq 1 60); do
            replica="$(az containerapp replica list \
              --name "${APP_NAME}" \
              --resource-group "${RESOURCE_GROUP}" \
              --revision "${new_revision}" \
              --query '[0].name' \
              -o tsv 2>/dev/null || true)"
            [[ -n "${replica}" ]] && break
            curl --silent --max-time 10 "https://${new_fqdn}/ready" >/dev/null || true
            sleep 2
          done
          [[ -n "${replica}" ]] || {
            echo 'No running rollout replica was available for live verification.'
            exit 1
          }

          runtime_command="$(node scripts/verifyAzureRuntimeEnvironment.mjs --emit-command)"
          bash scripts/execAzureContainerAppCommand.sh \
            --name "${APP_NAME}" \
            --resource-group "${RESOURCE_GROUP}" \
            --revision "${new_revision}" \
            --replica "${replica}" \
            --container "${IMAGE_REPOSITORY}" \
            --command "${runtime_command}" | tee azure-runtime-report.jsonl
          grep -a '"event": "azure_runtime_environment"' azure-runtime-report.jsonl \
            | tail -1 \
            | jq -e '.ok == true' >/dev/null

          bash scripts/execAzureContainerAppCommand.sh \
            --name "${APP_NAME}" \
            --resource-group "${RESOURCE_GROUP}" \
            --revision "${new_revision}" \
            --replica "${replica}" \
            --container "${IMAGE_REPOSITORY}" \
            --command 'node dist/backend/verifyNemotronDeploymentReadiness.js --require-enabled --require-complete-bundle --expect-stage=full' \
            | tee deployment-readiness-full-rollout-report.jsonl
          grep -a -Eq '"event":"nemotron_deployment_readiness".*"ready":true' \
            deployment-readiness-full-rollout-report.jsonl
          expected_schema_version="$(
            node -e "process.stdout.write(require('./dist/backend/unifiedTextProductionReadiness.js').UNIFIED_TEXT_FULL_ROLLOUT_SCHEMA_VERSION)"
          )"
          [[ "${expected_schema_version}" =~ ^[0-9]{14}$ ]] || {
            echo 'Unified text rollout schema version export is invalid.'
            exit 1
          }
          grep -a '"event":"unified_text_production_readiness"' \
            deployment-readiness-full-rollout-report.jsonl \
            | tail -1 \
            | jq -e --arg expected "${expected_schema_version}" '
                .event == "unified_text_production_readiness"
                and .ready == true
                and .status == "ready"
                and .schemaVersion == $expected
                and .structuralReady == true
                and .missingCount == 0
                and .issueCode == null
              ' >/dev/null

          timeout 900s bash scripts/execAzureContainerAppCommand.sh \
            --name "${APP_NAME}" \
            --resource-group "${RESOURCE_GROUP}" \
            --revision "${new_revision}" \
            --replica "${replica}" \
            --container "${IMAGE_REPOSITORY}" \
            --command 'python backend/verifyNvidiaNemotronLive.py' \
            | tee nvidia-full-rollout-report.jsonl
          grep -a -Eq '"event"[[:space:]]*:[[:space:]]*"summary".*"failures"[[:space:]]*:[[:space:]]*0' \
            nvidia-full-rollout-report.jsonl
          [[ "$(grep -a -Ec '"event"[[:space:]]*:[[:space:]]*"independent_slot".*"status"[[:space:]]*:[[:space:]]*"pass"' nvidia-full-rollout-report.jsonl)" == "6" ]] || {
            echo 'All six NVIDIA slots did not pass independent live inference.'
            exit 1
          }

          timeout 180s bash scripts/execAzureContainerAppCommand.sh \
            --name "${APP_NAME}" \
            --resource-group "${RESOURCE_GROUP}" \
            --revision "${new_revision}" \
            --replica "${replica}" \
            --container "${IMAGE_REPOSITORY}" \
            --command 'python backend/verifyPollinationsIntuitiveLive.py' \
            | tee pollinations-full-rollout-report.jsonl
          grep -a -Eq '"event"[[:space:]]*:[[:space:]]*"pollinations_intuitive_verification".*"status"[[:space:]]*:[[:space:]]*"pass"' \
            pollinations-full-rollout-report.jsonl

          SENTIQ_LIVE_VERIFY_CONFIRM_FULL_ROLLOUT=FULL_ROLLOUT \
          SENTIQ_LIVE_VERIFY_BASE_URL="https://${new_fqdn}" \
          SENTIQ_LIVE_VERIFY_EXPECTED_HOST="${new_fqdn}" \
          SENTIQ_LIVE_VERIFY_REQUIRE_WEBSURF=true \
          SENTIQ_LIVE_VERIFY_CANARY_LABEL="full-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
          SENTIQ_LIVE_VERIFY_ANONYMOUS_ID="full-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            node scripts/verifyNemotronFullRolloutLive.mjs \
              | tee nemotron-full-rollout-report.jsonl
          grep -a -Eq '"scenario":"summary","status":"pass","failures":0' \
            nemotron-full-rollout-report.jsonl

          az containerapp ingress traffic set \
            --name "${APP_NAME}" \
            --resource-group "${RESOURCE_GROUP}" \
            --revision-weight "${PREVIOUS_REVISION}=0" "${new_revision}=100" \
            --only-show-errors \
            --output none
          traffic_shifted=1

          public_ready=0
          for attempt in $(seq 1 60); do
            public_status="$(curl \
              --silent \
              --output /dev/null \
              --write-out '%{http_code}' \
              --max-time 15 \
              "https://${FQDN}/ready" || true)"
            active_revision="$(az containerapp show \
              --name "${APP_NAME}" \
              --resource-group "${RESOURCE_GROUP}" \
              --query 'properties.latestReadyRevisionName' \
              -o tsv 2>/dev/null || true)"
            if [[ "${public_status}" == "200" && "${active_revision}" == "${new_revision}" ]]; then
              public_ready=1
              break
            fi
            sleep 2
          done
          [[ "${public_ready}" == "1" ]] || {
            echo 'Public production did not activate the verified rollout revision.'
            exit 1
          }

          current_latest="$(az containerapp show \
            --name "${APP_NAME}" \
            --resource-group "${RESOURCE_GROUP}" \
            --query 'properties.latestRevisionName' \
            -o tsv)"
          current_ready="$(az containerapp show \
            --name "${APP_NAME}" \
            --resource-group "${RESOURCE_GROUP}" \
            --query 'properties.latestReadyRevisionName' \
            -o tsv)"
          [[ "${current_latest}" == "${new_revision}" && "${current_ready}" == "${new_revision}" ]] || {
            echo 'Azure latest and latest-ready revisions do not match the verified rollout.'
            exit 1
          }
          new_weight="$(az containerapp revision list \
            --name "${APP_NAME}" \
            --resource-group "${RESOURCE_GROUP}" \
            --query "[?name=='${new_revision}'].properties.trafficWeight | [0]" \
            -o tsv)"
          previous_weight="$(az containerapp revision list \
            --name "${APP_NAME}" \
            --resource-group "${RESOURCE_GROUP}" \
            --query "[?name=='${PREVIOUS_REVISION}'].properties.trafficWeight | [0]" \
            -o tsv)"
          [[ "${new_weight}" == "100" && "${previous_weight}" == "0" ]] || {
            echo 'Final production traffic weights are unsafe.'
            exit 1
          }
          failed_traffic_count="$(az containerapp revision list \
            --name "${APP_NAME}" \
            --resource-group "${RESOURCE_GROUP}" \
            --query "[?properties.trafficWeight > \`0\` && (properties.healthState=='Unhealthy' || properties.provisioningState=='Failed')] | length(@)" \
            -o tsv)"
          [[ "${failed_traffic_count}" == "0" ]] || {
            echo 'A failed revision has production traffic.'
            exit 1
          }

          previous_health="$(az containerapp revision show \
            --name "${APP_NAME}" \
            --resource-group "${RESOURCE_GROUP}" \
            --revision "${PREVIOUS_REVISION}" \
            --query 'properties.healthState' \
            -o tsv)"
          previous_active="$(az containerapp revision show \
            --name "${APP_NAME}" \
            --resource-group "${RESOURCE_GROUP}" \
            --revision "${PREVIOUS_REVISION}" \
            --query 'properties.active' \
            -o tsv)"
          previous_image="$(az containerapp revision show \
            --name "${APP_NAME}" \
            --resource-group "${RESOURCE_GROUP}" \
            --revision "${PREVIOUS_REVISION}" \
            --query "properties.template.containers[?name=='${IMAGE_REPOSITORY}'].image | [0]" \
            -o tsv)"
          [[ "${previous_health}" == "Healthy" \
            && "${previous_active,,}" == "true" \
            && "${previous_image}" == "${PREVIOUS_IMAGE}" ]] || {
            echo 'The previous healthy revision is not retained for emergency rollback.'
            exit 1
          }

          jq -n \
            --arg event "azure_rollout_summary" \
            --arg status "pass" \
            --arg previous_revision "${PREVIOUS_REVISION}" \
            --arg new_revision "${new_revision}" \
            --arg image "${DEPLOY_IMAGE}" \
            --argjson new_weight "${new_weight}" \
            --argjson previous_weight "${previous_weight}" \
            '{
              event: $event,
              status: $status,
              previous_revision: $previous_revision,
              new_revision: $new_revision,
              image: $image,
              new_revision_traffic: $new_weight,
              previous_revision_traffic: $previous_weight,
              rollback_ready: true,
              automatic_rollback: false
            }' | tee "${azure_report}"

          write_summary success production_acceptance
          verified=1
          echo "new_revision=${new_revision}" >> "${GITHUB_OUTPUT}"
          echo "image=${DEPLOY_IMAGE}" >> "${GITHUB_OUTPUT}"
          echo "Full production rollout verified on ${new_revision}; ${PREVIOUS_REVISION} remains rollback-ready."

      - name: Deactivate stale failed zero-traffic revisions
        if: success()
        shell: bash
        env:
          APP_NAME: ${{ vars.AZURE_CONTAINER_APP_NAME }}
          RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
          PREVIOUS_REVISION: ${{ steps.production.outputs.previous_revision }}
          NEW_REVISION: ${{ steps.rollout.outputs.new_revision }}
        run: |
          set -Eeuo pipefail
          stale_count=0
          while IFS= read -r revision; do
            [[ -n "${revision}" ]] || continue
            if [[ "${revision}" != "${PREVIOUS_REVISION}" && "${revision}" != "${NEW_REVISION}" ]]; then
              az containerapp revision deactivate \
                --name "${APP_NAME}" \
                --resource-group "${RESOURCE_GROUP}" \
                --revision "${revision}" \
                --only-show-errors \
                --output none
              stale_count=$((stale_count + 1))
            fi
          done < <(az containerapp revision list \
            --name "${APP_NAME}" \
            --resource-group "${RESOURCE_GROUP}" \
            --query "[?properties.active==\`true\` && properties.trafficWeight==\`0\` && (properties.healthState=='Unhealthy' || properties.provisioningState=='Failed')].name" \
            -o tsv)
          echo "Stale failed zero-traffic revisions deactivated: ${stale_count}."

      - name: Write redacted failure evidence
        if: failure()
        shell: bash
        run: |
          set -Eeuo pipefail
          existing_phase="$(jq -r '.phase // empty' nemotron-rollout-summary.json 2>/dev/null || true)"
          if [[ "${existing_phase}" != "automatic_rollback" ]]; then
            jq -n \
              --arg status "failure" \
              --arg phase "workflow_failure" \
              --arg commit "${GITHUB_SHA}" \
              --arg run_id "${GITHUB_RUN_ID}" \
              '{
                event: "nemotron_full_rollout",
                status: $status,
                phase: $phase,
                commit: $commit,
                run_id: $run_id,
                secret_values_included: false
              }' > nemotron-rollout-summary.json
          fi

      - name: Upload redacted rollout evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: nemotron-full-rollout-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            nemotron-rollout-summary.json
            azure-full-rollout-report.jsonl
            azure-runtime-report.jsonl
            deployment-readiness-full-rollout-report.jsonl
            nvidia-full-rollout-report.jsonl
            pollinations-full-rollout-report.jsonl
            nemotron-full-rollout-report.jsonl
          if-no-files-found: error
          retention-days: 14

      - name: Delete temporary Azure metadata
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          if [[ -d "${ROLLOUT_TEMP_ROOT}" && "${ROLLOUT_TEMP_ROOT}" == "${RUNNER_TEMP}/sentiq-nemotron-"* ]]; then
            find "${ROLLOUT_TEMP_ROOT}" -type f -delete
            find "${ROLLOUT_TEMP_ROOT}" -depth -type d -empty -delete
          fi
