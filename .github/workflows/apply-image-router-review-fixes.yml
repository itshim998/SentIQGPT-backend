name: Apply image router review fixes

on:
  pull_request:
    paths:
      - "scripts/applyImageRouterReviewFixes.mjs"
      - ".github/workflows/apply-image-router-review-fixes.yml"

permissions:
  contents: write

jobs:
  apply-review-fixes:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - name: Apply fixes
        run: node scripts/applyImageRouterReviewFixes.mjs

      - name: Validate focused contracts
        run: |
          npm ci
          npm run build
          npm run test:image-routing-safety
          npx ts-node --project tsconfig.backend.json backend/testImagePolicyPass2.ts
          git diff --check

      - name: Commit fixes
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/tools/imageGeneration/imageRouter.ts backend/testImageRoutingSafety.ts backend/testImagePolicyPass2.ts
          git commit -m "Address image router review findings"
          git push origin HEAD:${{ github.head_ref }}
