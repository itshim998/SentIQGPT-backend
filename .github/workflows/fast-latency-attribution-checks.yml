name: Fast latency attribution checks

on:
  pull_request:
    paths:
      - "backend/fast_latency_observability.py"
      - "backend/fast_latency_httpx_stream.py"
      - "backend/observability/fast-latency-preload.cjs"
      - "backend/run_llm_service.py"
      - "backend/test_fast_latency_observability.py"
      - "frontend/scripts/config.js"
      - "frontend/scripts/observability/fast-latency.js"
      - "scripts/start-container.sh"
      - "scripts/test-fast-latency-*.mjs"
      - "docs/performance/FAST_MODE_WAVE0_LATENCY_ATTRIBUTION.md"
      - ".github/workflows/fast-latency-attribution-checks.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fast-latency-attribution-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    name: Trace lifecycle, privacy, and startup contracts
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Static syntax checks
        run: |
          set -Eeuo pipefail
          node --check frontend/scripts/observability/fast-latency.js
          node --check backend/observability/fast-latency-preload.cjs
          python -m py_compile \
            backend/fast_latency_observability.py \
            backend/fast_latency_httpx_stream.py \
            backend/run_llm_service.py
          bash -n scripts/start-container.sh

      - name: Browser first-token and paint attribution
        run: node scripts/test-fast-latency-browser.mjs

      - name: Node trace propagation and lifecycle
        run: node scripts/test-fast-latency-observability.mjs

      - name: Python provider first-delta attribution
        run: python backend/test_fast_latency_observability.py

      - name: Backend TypeScript build
        run: |
          npm ci
          npm run build
