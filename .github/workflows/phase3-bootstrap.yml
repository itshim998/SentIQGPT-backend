name: Phase 3 bootstrap verification

on:
  push:
    branches:
      - feature/flutter-android-app
    paths:
      - "tool/phase3-bundle.part-*"
      - ".github/workflows/phase3-bootstrap.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: phase3-bootstrap-${{ github.ref }}
  cancel-in-progress: false

env:
  FLUTTER_VERSION: "3.44.8"
  JAVA_VERSION: "17"

jobs:
  apply-and-verify:
    name: Apply, analyze, test, and build Phase 3
    runs-on: ubuntu-latest
    timeout-minutes: 50

    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Reconstruct Phase 3 source bundle
        run: |
          cat tool/phase3-bundle.part-* | base64 --decode | tar -xzf - -C .
          rm tool/phase3-bundle.part-*

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up pinned Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install SQLite test runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y libsqlite3-0 libsqlite3-dev

      - name: Prepare and format Flutter sources
        working-directory: mobile/sentiq_chat
        run: |
          flutter --version
          test "$(cat .flutter-version)" = "${FLUTTER_VERSION}"
          ./tool/bootstrap_android.sh
          flutter pub get
          dart format lib test

      - name: Commit reconstructed Phase 3 sources
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Implement native core chat and continuity"
          git push origin HEAD:${GITHUB_REF_NAME}

      - name: Static analysis
        working-directory: mobile/sentiq_chat
        run: flutter analyze

      - name: Unit and widget tests
        working-directory: mobile/sentiq_chat
        run: flutter test --coverage test/core test/features test/widgets

      - name: Navigation and adaptive integration tests
        working-directory: mobile/sentiq_chat
        run: flutter test test/integration

      - name: Contract fixture replay
        working-directory: mobile/sentiq_chat
        run: flutter test test/contracts/contract_fixture_replay_test.dart

      - name: Golden tests
        id: golden_tests
        working-directory: mobile/sentiq_chat
        run: flutter test test/goldens

      - name: Build Android debug APK
        working-directory: mobile/sentiq_chat
        run: flutter build apk --debug --dart-define=SENTIQ_ENV=development

      - name: Install backend dependencies
        run: npm ci

      - name: Compile backend
        run: npm run build

      - name: Verify mobile contract
        run: npx ts-node --project tsconfig.backend.json backend/testMobileContract.ts

      - name: Upload Android debug APK
        uses: actions/upload-artifact@v7
        with:
          name: sentiq-chat-phase3-bootstrap-${{ github.run_id }}
          path: mobile/sentiq_chat/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 7

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: flutter-phase3-coverage-${{ github.run_id }}
          path: mobile/sentiq_chat/coverage/lcov.info
          if-no-files-found: warn
          retention-days: 7

      - name: Upload golden failure evidence
        if: failure() && steps.golden_tests.outcome == 'failure'
        uses: actions/upload-artifact@v7
        with:
          name: flutter-phase3-golden-failures-${{ github.run_id }}
          path: mobile/sentiq_chat/test/failures/**
          if-no-files-found: warn
          retention-days: 7
