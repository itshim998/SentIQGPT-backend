name: Phase 6 Dart format repair

on:
  push:
    branches:
      - feature/flutter-android-app
    paths:
      - .github/workflows/phase6-dart-format.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/flutter-android-app
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.8"
          channel: stable
          cache: true
      - name: Apply canonical Dart formatting
        working-directory: mobile/sentiq_chat
        run: dart format test/goldens/workspace_layout_golden_test.dart
      - name: Commit formatting if required
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- mobile/sentiq_chat/test/goldens/workspace_layout_golden_test.dart; then
            echo "Already formatted"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mobile/sentiq_chat/test/goldens/workspace_layout_golden_test.dart
          git commit -m "Format Phase 6 workspace signature test"
          git push origin HEAD:feature/flutter-android-app
