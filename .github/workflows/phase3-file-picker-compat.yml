name: Phase 3 file picker compatibility

on:
  push:
    branches:
      - feature/flutter-android-app
    paths:
      - ".github/workflows/phase3-file-picker-compat.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: phase3-file-picker-compat-${{ github.ref }}
  cancel-in-progress: false

env:
  FLUTTER_VERSION: "3.44.8"

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Apply compatible API and regenerate lockfile
        working-directory: mobile/sentiq_chat
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('lib/features/chat/presentation/chat_composer.dart')
          text = path.read_text(encoding='utf-8')
          old = 'FilePicker.pickFiles('
          new = 'FilePicker.platform.pickFiles('
          if text.count(old) != 1:
              raise SystemExit(f'Expected one file picker call, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          ./tool/bootstrap_android.sh
          flutter pub get
          dart format lib/features/chat/presentation/chat_composer.dart
          flutter analyze
      - name: Commit compatibility output and remove helper
        run: |
          rm .github/workflows/phase3-file-picker-compat.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mobile/sentiq_chat/lib/features/chat/presentation/chat_composer.dart mobile/sentiq_chat/pubspec.lock .github/workflows/phase3-file-picker-compat.yml
          git commit -m "Fix Android file picker compatibility"
          git push origin HEAD:${GITHUB_REF_NAME}
